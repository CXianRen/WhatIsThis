<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fa"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bookGradient)"/>
  
  <!-- 书本 -->
  <rect x="96" y="128" width="320" height="256" rx="16" ry="16" fill="url(#pageGradient)" stroke="#4a5568" stroke-width="4"/>
  
  <!-- 文本行 -->
  <line x1="128" y1="176" x2="384" y2="176" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="208" x2="352" y2="208" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="240" x2="368" y2="240" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="272" x2="336" y2="272" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="304" x2="384" y2="304" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="336" x2="320" y2="336" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 问号图标 -->
  <circle cx="384" cy="176" r="40" fill="#ff6b6b" stroke="#ffffff" stroke-width="8"/>
  <text x="384" y="192" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">?</text>
</svg>
