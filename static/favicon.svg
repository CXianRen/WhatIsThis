<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fa"/>
    </linearGradient>
  </defs>
  
  <!-- 书本背景 -->
  <rect x="8" y="12" width="48" height="40" rx="4" ry="4" fill="url(#bookGradient)" stroke="#4a5568" stroke-width="1"/>
  
  <!-- 书页 -->
  <rect x="12" y="16" width="40" height="32" rx="2" ry="2" fill="url(#pageGradient)" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- 文本行 -->
  <line x1="16" y1="22" x2="48" y2="22" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="44" y2="26" stroke="#667eea" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="46" y2="30" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="34" x2="42" y2="34" stroke="#667eea" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="48" y2="38" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="42" x2="40" y2="42" stroke="#667eea" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 问号图标 -->
  <circle cx="48" cy="20" r="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
  <text x="48" y="26" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">?</text>
  
  <!-- 书脊装饰 -->
  <line x1="8" y1="16" x2="8" y2="48" stroke="#4a5568" stroke-width="1"/>
  <line x1="10" y1="16" x2="10" y2="48" stroke="#667eea" stroke-width="0.5"/>
</svg>
