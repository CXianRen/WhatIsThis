<link rel="stylesheet" href="/static/word_detail_panel.css">

<div class="right-panel">
    <h3 id="rightPanelTitle">Word Details</h3>
    
    <div class="detail-section" id="pronunciationSection">
        <!-- <h4>Pronunciation</h4> -->
        <div id="pronunciationContainer" style="display: flex; align-items: center; gap: 8px;">
            <div class="pronunciation" id="phoneticText"></div>
            <button class="audio-button" id="audioButton" style="display: none;" onclick="playAudio()">🔊</button>
        </div>
    </div>

    <div class="detail-section" id="definitionSection">
    </div>

    <div class="detail-section" id="imagesSection">
        <h4>Related Images</h4>
        <div id="imagesGrid" class="images-grid">
            <div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">
                No images available
            </div>
        </div>
        <!-- 自定义关键词搜索 -->
        <div class="custom-search-section">
            <label for="customSearchInput">Search:</label>
            <div class="search-input-group">
                <input type="text" id="customSearchInput" placeholder="keyword...">
                <button id="customSearchBtn" onclick="searchWithCustomKey()">
                    🔍
                </button>
            </div>
        </div>
    </div>

    <div class="detail-section" id="notesSection">
        <h4>Notes</h4>
        <textarea class="notes-area" id="notesArea" placeholder="Write your notes here..."></textarea>
        <button style="margin-top: 8px; padding: 6px 12px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="saveNotes()">Save Notes</button>
    </div>
</div>
