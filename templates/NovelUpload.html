<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说章节管理</title>
  <link rel="stylesheet" href="/static/css/novel_ul.css" />
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>📚 小说章节管理</h1>
      <p>上传、编辑和管理您的小说章节</p>
    </div>

    <!-- 导航标签 -->
    <div class="nav-tabs">
      <a href="/novel-upload" class="nav-tab active">📖 章节管理</a>
      <a href="/novel-translation" class="nav-tab">🌍 语言转换</a>
    </div>
    <div class="main-content">
      <!-- 左侧面板 - 小说选择和章节列表 -->
      <div class="left-panel">
        <!-- 小说选择 -->
        <div class="novel-selector">
          <h3 class="section-title">选择小说</h3>
          <button class="add-novel-btn" onclick="showAddNovelDialog()">
            ➕ 新增小说
          </button>
          <div id="novelList">
            <!-- 小说列表将在这里动态生成 -->
          </div>
        </div>

        <!-- 章节列表 -->
        <div class="chapter-list">
          <h3 class="section-title">章节列表</h3>
          <div id="chapterList">
            <div class="empty-state">
              <div class="empty-icon">📖</div>
              <p>请先选择一个小说</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧面板 - 上传/编辑表单 -->
      <div class="right-panel">
        <h3 class="section-title">章节管理</h3>

        <!-- 默认提示 -->
        <div id="defaultHint" class="empty-state">
          <div class="empty-icon">✍️</div>
          <p>选择小说后，点击"新增章节"开始上传</p>
          <button class="add-novel-btn" onclick="showUploadForm()" style="margin-top: 20px; display: none;"
            id="addChapterBtn">
            ➕ 新增章节
          </button>
        </div>

        <!-- 上传表单 -->
        <div id="uploadForm" class="upload-form">
          <form onsubmit="submitChapter(event)">
            <div class="form-group">
              <label class="form-label" for="chapterTitle">章节标题</label>
              <input type="text" id="chapterTitle" class="form-input" placeholder="请输入章节标题" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="chapterID">章节ID</label>
              <input type="number" id="chapterID" class="form-input" placeholder="请输入章节ID" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="chapterContent">章节内容</label>
              <textarea id="chapterContent" class="form-textarea" placeholder="请输入章节内容..." required></textarea>
            </div>

            <div class="form-buttons">
              <button type="button" class="btn-cancel" onclick="hideUploadForm()">取消</button>
              <button type="submit" class="btn-submit">保存章节</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增小说对话框 -->
  <div id="addNovelDialog" class="dialog-overlay">
    <div class="dialog">
      <h3>新增小说</h3>
      <div class="form-group">
        <label class="form-label" for="novelName">小说名称</label>
        <input type="text" id="novelName" class="form-input" placeholder="请输入小说名称">
      </div>
      <div class="dialog-buttons">
        <button class="btn-secondary" onclick="hideAddNovelDialog()">取消</button>
        <button class="btn-primary" onclick="addNewNovel()">确定</button>
      </div>
    </div>
  </div>

  <!-- 确认删除对话框 -->
  <div id="confirmDialog" class="dialog-overlay">
    <div class="dialog">
      <h3>确认删除</h3>
      <p id="confirmMessage">确定要删除吗？此操作不可撤销。</p>
      <div class="dialog-buttons">
        <button class="btn-secondary" onclick="hideConfirmDialog()">取消</button>
        <button class="btn-primary" onclick="confirmAction()">确定</button>
      </div>
    </div>
  </div>

  <script src="/static/js/novel_util.js"></script>
  <script>
    // 全局变量
    let novels = [];
    let currentNovel = null;
    let currentChapter = null;
    let isEditing = false;
    let confirmCallback = null;
    let name_chapters_map = {};

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function () {
      loadNovels();
    });

    // 加载小说列表
    async function loadNovels() {
      novels = [];
      try {
        const response = await fetch('/novel/list');
        if (response.ok) {
          novels = await response.json();
        } else {
          console.error('加载小说列表失败:', response.statusText);
        }
      } catch (error) {
        console.error('加载小说列表失败:', error);
      }
      renderNovelList();
    }

    // 渲染小说列表
    function renderNovelList() {
      const novelList = document.getElementById('novelList');

      if (novels.length === 0) {
        novelList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📚</div>
            <p>还没有小说，点击上方按钮新增</p>
          </div>
        `;
        return;
      }

      novelList.innerHTML = novels.map(novel => `
        <div class="novel-item ${currentNovel?.name === novel.name ? 'active' : ''}" 
             onclick="selectNovel('${novel.name}')">
          <div class="novel-name">${novel.display_name || novel.name}</div>
          <div class="chapter-count">${novel.chapter_count || 0} 章节</div>
        </div>
      `).join('');
    }

    // 选择小说
    async function selectNovel(novelName) {
      currentNovel = novels.find(n => n.name === novelName);
      renderNovelList();

      await loadChapters();

      // 显示新增章节按钮
      document.getElementById('addChapterBtn').style.display = 'block';
      document.getElementById('defaultHint').querySelector('p').textContent =
        `已选择：${currentNovel.display_name || currentNovel.name}`;
    }

    // 加载章节列表
    async function loadChapters() {
      console.log("加载章节列表");
      const chapterList = document.getElementById('chapterList');

      if (!currentNovel) {
        chapterList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <p>请先选择一个小说</p>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(`/novel/${currentNovel.name}/chapters`);
        if (response.ok) {
          const chapters = await response.json();
          console.log("章节数据:", chapters);
          currentNovel.chapters = chapters;
        } else {
          console.error('加载章节失败:', response.statusText);
          currentNovel.chapters = [];
        }
      } catch (error) {
        console.error('加载章节失败:', error);
        currentNovel.chapters = [];
      }

      if (!currentNovel.chapters || currentNovel.chapters.length === 0) {
        chapterList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <p>该小说还没有章节</p>
          </div>
        `;
        return;
      }

      chapterList.innerHTML = currentNovel.chapters.map(chapter => `
        <div class="chapter-item">
          <div class="chapter-info">
            <div class="chapter-title">${chapter.title}</div>
            <div class="language-flags">
              ${renderLanguageFlags(chapter)}
            </div>
          </div>
          <div class="chapter-actions">
            <button class="btn-edit" onclick="editChapter(${chapter.cid})">编辑</button>
            <button class="btn-delete" onclick="deleteChapter(${chapter.cid})">删除</button>
          </div>
        </div>
      `).join('');
    }

    // 显示上传表单
    function showUploadForm() {
      if (!currentNovel) {
        alert('请先选择一个小说');
        return;
      }

      document.getElementById('defaultHint').style.display = 'none';
      document.getElementById('uploadForm').classList.add('active');

      // 清空表单
      document.getElementById('chapterTitle').value = '';
      document.getElementById('chapterContent').value = '';
      document.getElementById('chapterID').value = '';
      document.getElementById('chapterID').disabled = false; // 允许编辑ID

      isEditing = false;
      currentChapter = null;
    }

    // 隐藏上传表单
    function hideUploadForm() {
      document.getElementById('uploadForm').classList.remove('active');
      document.getElementById('defaultHint').style.display = 'block';

      // 清空表单
      document.getElementById('chapterTitle').value = '';
      document.getElementById('chapterContent').value = '';
      document.getElementById('chapterID').value = '';
      document.getElementById('chapterID').disabled = false; // 允许编辑ID

      isEditing = false;
      currentChapter = null;
    }

    // 编辑章节
    async function editChapter(chapterId) {
      const chapter = currentNovel.chapters.find(c => c.cid === chapterId);
      if (!chapter) {
        console.log("chapter not found:", chapterId);
        console.log(currentNovel.chapters);
        return;
      }

      try {
        // 通过raw API获取章节内容
        const response = await fetch(`/novel/${currentNovel.name}/chapters/raw/${chapterId}`);
        if (!response.ok) {
          alert('加载章节内容失败');
          return;
        }

        const chapterData = await response.json();

        currentChapter = chapter;
        isEditing = true;

        document.getElementById('chapterTitle').value = chapterData.title;
        document.getElementById('chapterID').value = chapterData.cid;
        document.getElementById('chapterID').disabled = true; // 禁止编辑ID
        document.getElementById('chapterContent').value = chapterData.content;

        document.getElementById('defaultHint').style.display = 'none';
        document.getElementById('uploadForm').classList.add('active');
      } catch (error) {
        console.error('加载章节内容失败:', error);
        alert('加载章节内容失败');
      }
    }

    // 删除章节
    async function deleteChapter(chapterId) {
      const chapter = currentNovel.chapters.find(c => c.cid === chapterId);
      if (!chapter) {
        console.log("chapter not found:", chapterId);
        console.log(currentNovel.chapters);
        return;
      }

      showConfirmDialog(
        `确定要删除章节"${chapter.title}"吗？此操作不可撤销。`,
        async () => {
          try {
            const url = `/novel/${currentNovel.name}/chapters/update`;
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                action: 'delete',
                cid: chapterId
              })
            });

            if (response.ok) {
              // 重新加载章节列表
              await loadChapters();

              // 更新小说章节计数
              await loadNovels();
              renderNovelList();

              // 如果正在编辑这个章节，关闭编辑表单
              if (currentChapter && currentChapter.cid === chapterId) {
                hideUploadForm();
              }

              alert('章节删除成功');
            } else {
              const result = await response.json();
              alert(`删除失败: ${result.error || '未知错误'}`);
            }
          } catch (error) {
            console.error('删除章节失败:', error);
            alert('删除失败，请重试');
          }
        }
      );
    }

    // 提交章节
    async function submitChapter(event) {
      event.preventDefault();

      const title = document.getElementById('chapterTitle').value.trim();
      const content = document.getElementById('chapterContent').value.trim();
      const chapterID = document.getElementById('chapterID').value.trim();

      if (!title || !content || !chapterID) {
        alert('请填写完整的章节信息');
        return;
      }
      const url = `/novel/${currentNovel.name}/chapters/update`;
      try {
        if (isEditing && currentChapter) {
          // 更新现有章节
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              action: 'update',
              cid: parseInt(chapterID),
              title: title,
              content: content
            })
          });

          if (response.ok) {
            alert('章节更新成功');
          } else {
            const result = await response.json();
            alert(`更新失败: ${result.error || '未知错误'}`);
            return;
          }
        } else {
          // 添加新章节
          console.log('Adding new chapter:', title);

          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              action: 'create',
              cid: parseInt(chapterID),
              title: title,
              content: content
            })
          });

          if (response.ok) {
            alert('章节添加成功');
          } else {
            const result = await response.json();
            alert(`添加失败: ${result.error || '未知错误'}`);
            return;
          }
        }

        // 重新加载章节列表
        await loadChapters();

        // 更新小说章节计数
        await loadNovels();
        renderNovelList();

        hideUploadForm();

      } catch (error) {
        console.error('提交章节失败:', error);
        alert('操作失败，请重试');
      }
    }

    // 显示新增小说对话框
    function showAddNovelDialog() {
      document.getElementById('addNovelDialog').style.display = 'flex';
      document.getElementById('novelName').value = '';
      document.getElementById('novelName').focus();
    }

    // 隐藏新增小说对话框
    function hideAddNovelDialog() {
      document.getElementById('addNovelDialog').style.display = 'none';
    }

    // 添加新小说
    async function addNewNovel() {
      const name = document.getElementById('novelName').value.trim();
      if (!name) {
        alert('请输入小说名称');
        return;
      }

      // 检查是否重复
      if (novels.find(n => n.name === name || n.display_name === name)) {
        alert('小说名称已存在');
        return;
      }

      try {
        const response = await fetch('/novel/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name
          })
        });

        if (response.ok) {
          alert('小说添加成功');
          hideAddNovelDialog();
          await loadNovels();
        } else {
          const result = await response.json();
          alert(`添加失败: ${result.error || '未知错误'}`);
        }
      } catch (error) {
        console.error('添加小说失败:', error);
        alert('添加失败，请重试');
      }
    }

    // 显示确认对话框
    function showConfirmDialog(message, callback) {
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmDialog').style.display = 'flex';
      confirmCallback = callback;
    }

    // 隐藏确认对话框
    function hideConfirmDialog() {
      document.getElementById('confirmDialog').style.display = 'none';
      confirmCallback = null;
    }

    // 确认操作
    function confirmAction() {
      if (confirmCallback) {
        confirmCallback();
      }
      hideConfirmDialog();
    }

    // ESC键关闭对话框
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        hideAddNovelDialog();
        hideConfirmDialog();
      }
    });

    // 点击对话框外部关闭
    document.getElementById('addNovelDialog').addEventListener('click', function (event) {
      if (event.target === this) {
        hideAddNovelDialog();
      }
    });

    document.getElementById('confirmDialog').addEventListener('click', function (event) {
      if (event.target === this) {
        hideConfirmDialog();
      }
    });
  </script>
</body>

</html>
