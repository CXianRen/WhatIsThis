<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说章节管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      min-height: calc(100vh - 40px);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 20px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .header p {
      color: #666;
      font-size: 1.1rem;
    }
    
    .main-content {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
      height: calc(100vh - 200px);
    }
    
    .left-panel {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      overflow-y: auto;
    }
    
    .right-panel {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      overflow-y: auto;
    }
    
    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
    }
    
    /* 小说选择区域 */
    .novel-selector {
      margin-bottom: 30px;
    }
    
    .novel-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      margin: 10px 0;
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .novel-item:hover {
      background: #e9ecef;
      border-color: #667eea;
      transform: translateY(-2px);
    }
    
    .novel-item.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-color: #667eea;
    }
    
    .novel-name {
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    .chapter-count {
      background: rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.9rem;
    }
    
    .novel-item.active .chapter-count {
      background: rgba(255,255,255,0.3);
    }
    
    /* 新增小说按钮 */
    .add-novel-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    
    .add-novel-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(67,233,123,0.3);
    }
    
    /* 章节列表 */
    .chapter-list {
      margin-bottom: 30px;
    }
    
    .chapter-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      margin: 8px 0;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .chapter-item:hover {
      background: #e9ecef;
    }
    
    .chapter-info {
      flex: 1;
    }
    
    .chapter-title {
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    /* 语言支持标识 */
    .language-flags {
      display: flex;
      gap: 4px;
      margin-top: 5px;
    }
    
    .flag {
      font-size: 16px;
      opacity: 0.3;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .flag.available {
      opacity: 1;
    }
    
    .flag:hover {
      transform: scale(1.2);
    }
    
    .chapter-actions {
      display: flex;
      gap: 8px;
    }
    
    .btn-edit, .btn-delete {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    
    .btn-edit {
      background: #007bff;
      color: white;
    }
    
    .btn-edit:hover {
      background: #0056b3;
    }
    
    .btn-delete {
      background: #dc3545;
      color: white;
    }
    
    .btn-delete:hover {
      background: #c82333;
    }
    
    /* 上传表单 */
    .upload-form {
      display: none;
    }
    
    .upload-form.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    
    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .form-textarea {
      width: 100%;
      min-height: 300px;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.3s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .form-textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .form-buttons {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 25px;
    }
    
    .btn-submit, .btn-cancel {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102,126,234,0.3);
    }
    
    .btn-cancel {
      background: #6c757d;
      color: white;
    }
    
    .btn-cancel:hover {
      background: #5a6268;
    }
    
    /* 对话框样式 */
    .dialog-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .dialog {
      background: white;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    
    .dialog h3 {
      margin-bottom: 15px;
      color: #333;
    }
    
    .dialog-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    
    .btn-primary, .btn-secondary {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    
    .btn-primary {
      background: #007bff;
      color: white;
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      .main-content {
        grid-template-columns: 1fr;
        gap: 20px;
        height: auto;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .left-panel, .right-panel {
        padding: 20px;
      }
      
      .chapter-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      
      .chapter-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
    
    /* 导航标签样式 */
    .nav-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .nav-tab {
      padding: 15px 25px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 500;
      color: #666;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    
    .nav-tab:hover {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    
    .nav-tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
      background: rgba(102, 126, 234, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 小说章节管理</h1>
      <p>上传、编辑和管理您的小说章节</p>
    </div>
    
    <!-- 导航标签 -->
    <div class="nav-tabs">
      <a href="/novel-upload" class="nav-tab active">📖 章节管理</a>
      <a href="/novel-translation" class="nav-tab">🌍 语言转换</a>
    </div>    <div class="main-content">
      <!-- 左侧面板 - 小说选择和章节列表 -->
      <div class="left-panel">
        <!-- 小说选择 -->
        <div class="novel-selector">
          <h3 class="section-title">选择小说</h3>
          <button class="add-novel-btn" onclick="showAddNovelDialog()">
            ➕ 新增小说
          </button>
          <div id="novelList">
            <!-- 小说列表将在这里动态生成 -->
          </div>
        </div>
        
        <!-- 章节列表 -->
        <div class="chapter-list">
          <h3 class="section-title">章节列表</h3>
          <div id="chapterList">
            <div class="empty-state">
              <div class="empty-icon">📖</div>
              <p>请先选择一个小说</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 右侧面板 - 上传/编辑表单 -->
      <div class="right-panel">
        <h3 class="section-title">章节管理</h3>
        
        <!-- 默认提示 -->
        <div id="defaultHint" class="empty-state">
          <div class="empty-icon">✍️</div>
          <p>选择小说后，点击"新增章节"开始上传</p>
          <button class="add-novel-btn" onclick="showUploadForm()" style="margin-top: 20px; display: none;" id="addChapterBtn">
            ➕ 新增章节
          </button>
        </div>
        
        <!-- 上传表单 -->
        <div id="uploadForm" class="upload-form">
          <form onsubmit="submitChapter(event)">
            <div class="form-group">
              <label class="form-label" for="chapterTitle">章节标题</label>
              <input type="text" id="chapterTitle" class="form-input" placeholder="请输入章节标题" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="chapterContent">章节内容</label>
              <textarea id="chapterContent" class="form-textarea" placeholder="请输入章节内容..." required></textarea>
            </div>
            
            <div class="form-buttons">
              <button type="button" class="btn-cancel" onclick="hideUploadForm()">取消</button>
              <button type="submit" class="btn-submit">保存章节</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 新增小说对话框 -->
  <div id="addNovelDialog" class="dialog-overlay">
    <div class="dialog">
      <h3>新增小说</h3>
      <div class="form-group">
        <label class="form-label" for="novelName">小说名称</label>
        <input type="text" id="novelName" class="form-input" placeholder="请输入小说名称">
      </div>
      <div class="dialog-buttons">
        <button class="btn-secondary" onclick="hideAddNovelDialog()">取消</button>
        <button class="btn-primary" onclick="addNewNovel()">确定</button>
      </div>
    </div>
  </div>
  
  <!-- 确认删除对话框 -->
  <div id="confirmDialog" class="dialog-overlay">
    <div class="dialog">
      <h3>确认删除</h3>
      <p id="confirmMessage">确定要删除吗？此操作不可撤销。</p>
      <div class="dialog-buttons">
        <button class="btn-secondary" onclick="hideConfirmDialog()">取消</button>
        <button class="btn-primary" onclick="confirmAction()">确定</button>
      </div>
    </div>
  </div>

  <script>
    // 全局变量
    let novels = [];
    let currentNovel = null;
    let currentChapter = null;
    let isEditing = false;
    let confirmCallback = null;
    
    // 语言配置
    const LANGUAGES = {
      'zh': { flag: '🇨🇳', name: '中文', extension: '.txt' },
      'en': { flag: '🇺🇸', name: '英文', extension: '.en.json' },
      'se': { flag: '🇸🇪', name: '瑞典语', extension: '.se.json' },
      'fr': { flag: '🇫🇷', name: '法语', extension: '.fr.json' }
    };
    
    // 检查章节的语言支持
    function getChapterLanguageSupport(chapter) {
      const support = {};
      
      // 检查中文支持 (原始 .txt 文件)
      if (chapter.filename && chapter.filename.endsWith('.txt')) {
        support.zh = true;
      }
      
      // 检查其他语言支持
      if (chapter.languages) {
        Object.keys(chapter.languages).forEach(lang => {
          if (LANGUAGES[lang]) {
            support[lang] = true;
          }
        });
      }
      
      return support;
    }
    
    // 渲染语言标识
    function renderLanguageFlags(chapter) {
      const support = getChapterLanguageSupport(chapter);
      
      return Object.keys(LANGUAGES).map(lang => {
        const langConfig = LANGUAGES[lang];
        const isAvailable = support[lang] || false;
        return `<span class="flag ${isAvailable ? 'available' : ''}" 
                      title="${langConfig.name}${isAvailable ? ' (已支持)' : ' (未支持)'}"
                      data-lang="${lang}" data-chapter-id="${chapter.id}"
                      onclick="toggleLanguageSupport('${lang}', ${chapter.id})">
                  ${langConfig.flag}
                </span>`;
      }).join('');
    }
    
    // 切换语言支持
    async function toggleLanguageSupport(lang, chapterId) {
      const chapter = currentNovel.chapters.find(c => c.id === chapterId);
      if (!chapter) return;
      
      const support = getChapterLanguageSupport(chapter);
      const isCurrentlySupported = support[lang] || false;
      
      if (isCurrentlySupported) {
        // 移除语言支持
        if (lang === 'zh') {
          alert('不能删除中文版本，这是原始版本');
          return;
        }
        
        showConfirmDialog(
          `确定要删除"${chapter.title}"的${LANGUAGES[lang].name}版本吗？`,
          async () => {
            try {
              const response = await fetch(`/api/novels/${currentNovel.name}/chapters/${chapterId}/languages/${lang}`, {
                method: 'DELETE'
              });
              
              if (response.ok) {
                await loadChapters();
                alert(`${LANGUAGES[lang].name}版本删除成功`);
              } else {
                const result = await response.json();
                alert(`删除失败: ${result.error || '未知错误'}`);
              }
            } catch (error) {
              console.error('删除语言版本失败:', error);
              alert('删除失败，请重试');
            }
          }
        );
      } else {
        // 添加语言支持
        showLanguageEditor(lang, chapterId);
      }
    }
    
    // 显示语言版本编辑器
    function showLanguageEditor(lang, chapterId) {
      const chapter = currentNovel.chapters.find(c => c.id === chapterId);
      if (!chapter) return;
      
      const content = prompt(`请输入"${chapter.title}"的${LANGUAGES[lang].name}版本内容:`);
      if (content === null) return; // 用户取消
      
      if (content.trim() === '') {
        alert('内容不能为空');
        return;
      }
      
      // 保存语言版本
      saveLanguageVersion(lang, chapterId, content.trim());
    }
    
    // 保存语言版本
    async function saveLanguageVersion(lang, chapterId, content) {
      try {
        const response = await fetch(`/api/novels/${currentNovel.name}/chapters/${chapterId}/languages/${lang}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: content
          })
        });
        
        if (response.ok) {
          await loadChapters();
          alert(`${LANGUAGES[lang].name}版本保存成功`);
        } else {
          const result = await response.json();
          alert(`保存失败: ${result.error || '未知错误'}`);
        }
      } catch (error) {
        console.error('保存语言版本失败:', error);
        alert('保存失败，请重试');
      }
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
      loadNovels();
    });

    // 加载小说列表
    async function loadNovels() {
      try {
        const response = await fetch('/api/novels');
        if (response.ok) {
          novels = await response.json();
        } else {
          console.error('加载小说列表失败:', response.statusText);
          novels = [];
        }
        renderNovelList();
      } catch (error) {
        console.error('加载小说列表失败:', error);
        novels = [];
        renderNovelList();
      }
    }

    // 渲染小说列表
    function renderNovelList() {
      const novelList = document.getElementById('novelList');
      
      if (novels.length === 0) {
        novelList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📚</div>
            <p>还没有小说，点击上方按钮新增</p>
          </div>
        `;
        return;
      }
      
      novelList.innerHTML = novels.map(novel => `
        <div class="novel-item ${currentNovel?.id === novel.id ? 'active' : ''}" 
             onclick="selectNovel(${novel.id})">
          <div class="novel-name">${novel.displayName || novel.name}</div>
          <div class="chapter-count">${novel.chapterCount || 0} 章节</div>
        </div>
      `).join('');
    }

    // 选择小说
    async function selectNovel(novelId) {
      currentNovel = novels.find(n => n.id === novelId);
      renderNovelList();
      await loadChapters();
      
      // 显示新增章节按钮
      document.getElementById('addChapterBtn').style.display = 'block';
      document.getElementById('defaultHint').querySelector('p').textContent = 
        `已选择：${currentNovel.displayName || currentNovel.name}`;
    }

    // 加载章节列表
    async function loadChapters() {
      const chapterList = document.getElementById('chapterList');
      
      if (!currentNovel) {
        chapterList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <p>请先选择一个小说</p>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(`/api/novels/${currentNovel.name}/chapters`);
        if (response.ok) {
          currentNovel.chapters = await response.json();
        } else {
          console.error('加载章节失败:', response.statusText);
          currentNovel.chapters = [];
        }
      } catch (error) {
        console.error('加载章节失败:', error);
        currentNovel.chapters = [];
      }
      
      if (!currentNovel.chapters || currentNovel.chapters.length === 0) {
        chapterList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <p>该小说还没有章节</p>
          </div>
        `;
        return;
      }
      
      chapterList.innerHTML = currentNovel.chapters.map(chapter => `
        <div class="chapter-item">
          <div class="chapter-info">
            <div class="chapter-title">${chapter.title}</div>
            <div class="language-flags">
              ${renderLanguageFlags(chapter)}
            </div>
          </div>
          <div class="chapter-actions">
            <button class="btn-edit" onclick="editChapter(${chapter.id})">编辑</button>
            <button class="btn-delete" onclick="deleteChapter(${chapter.id})">删除</button>
          </div>
        </div>
      `).join('');
    }

    // 显示上传表单
    function showUploadForm() {
      if (!currentNovel) {
        alert('请先选择一个小说');
        return;
      }
      
      document.getElementById('defaultHint').style.display = 'none';
      document.getElementById('uploadForm').classList.add('active');
      
      // 清空表单
      document.getElementById('chapterTitle').value = '';
      document.getElementById('chapterContent').value = '';
      
      isEditing = false;
      currentChapter = null;
    }

    // 隐藏上传表单
    function hideUploadForm() {
      document.getElementById('uploadForm').classList.remove('active');
      document.getElementById('defaultHint').style.display = 'block';
      
      // 清空表单
      document.getElementById('chapterTitle').value = '';
      document.getElementById('chapterContent').value = '';
      
      isEditing = false;
      currentChapter = null;
    }

    // 编辑章节
    function editChapter(chapterId) {
      const chapter = currentNovel.chapters.find(c => c.id === chapterId);
      if (!chapter) return;
      
      currentChapter = chapter;
      isEditing = true;
      
      document.getElementById('chapterTitle').value = chapter.title;
      document.getElementById('chapterContent').value = chapter.content;
      
      document.getElementById('defaultHint').style.display = 'none';
      document.getElementById('uploadForm').classList.add('active');
    }

    // 删除章节
    async function deleteChapter(chapterId) {
      const chapter = currentNovel.chapters.find(c => c.id === chapterId);
      if (!chapter) return;
      
      showConfirmDialog(
        `确定要删除章节"${chapter.title}"吗？此操作不可撤销。`,
        async () => {
          try {
            const response = await fetch(`/api/novels/${currentNovel.name}/chapters/${chapterId}`, {
              method: 'DELETE'
            });
            
            if (response.ok) {
              // 重新加载章节列表
              await loadChapters();
              
              // 更新小说章节计数
              await loadNovels();
              renderNovelList();
              
              // 如果正在编辑这个章节，关闭编辑表单
              if (currentChapter && currentChapter.id === chapterId) {
                hideUploadForm();
              }
              
              alert('章节删除成功');
            } else {
              const result = await response.json();
              alert(`删除失败: ${result.error || '未知错误'}`);
            }
          } catch (error) {
            console.error('删除章节失败:', error);
            alert('删除失败，请重试');
          }
        }
      );
    }

    // 提交章节
    async function submitChapter(event) {
      event.preventDefault();
      
      const title = document.getElementById('chapterTitle').value.trim();
      const content = document.getElementById('chapterContent').value.trim();
      
      if (!title || !content) {
        alert('请填写完整的章节信息');
        return;
      }
      
      try {
        if (isEditing && currentChapter) {
          // 更新现有章节
          const response = await fetch(`/api/novels/${currentNovel.name}/chapters/${currentChapter.id}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              title: title,
              content: content
            })
          });
          
          if (response.ok) {
            alert('章节更新成功');
          } else {
            const result = await response.json();
            alert(`更新失败: ${result.error || '未知错误'}`);
            return;
          }
        } else {
          // 添加新章节
          const response = await fetch(`/api/novels/${currentNovel.name}/chapters`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              title: title,
              content: content
            })
          });
          
          if (response.ok) {
            alert('章节添加成功');
          } else {
            const result = await response.json();
            alert(`添加失败: ${result.error || '未知错误'}`);
            return;
          }
        }
        
        // 重新加载章节列表
        await loadChapters();
        
        // 更新小说章节计数
        await loadNovels();
        renderNovelList();
        
        hideUploadForm();
        
      } catch (error) {
        console.error('提交章节失败:', error);
        alert('操作失败，请重试');
      }
    }

    // 显示新增小说对话框
    function showAddNovelDialog() {
      document.getElementById('addNovelDialog').style.display = 'flex';
      document.getElementById('novelName').value = '';
      document.getElementById('novelName').focus();
    }

    // 隐藏新增小说对话框
    function hideAddNovelDialog() {
      document.getElementById('addNovelDialog').style.display = 'none';
    }

    // 添加新小说
    async function addNewNovel() {
      const name = document.getElementById('novelName').value.trim();
      if (!name) {
        alert('请输入小说名称');
        return;
      }
      
      // 检查是否重复
      if (novels.find(n => n.name === name || n.displayName === name)) {
        alert('小说名称已存在');
        return;
      }
      
      try {
        const response = await fetch('/api/novels', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name.toLowerCase().replace(/\s+/g, '_')
          })
        });
        
        if (response.ok) {
          alert('小说添加成功');
          hideAddNovelDialog();
          await loadNovels();
        } else {
          const result = await response.json();
          alert(`添加失败: ${result.error || '未知错误'}`);
        }
      } catch (error) {
        console.error('添加小说失败:', error);
        alert('添加失败，请重试');
      }
    }

    // 显示确认对话框
    function showConfirmDialog(message, callback) {
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmDialog').style.display = 'flex';
      confirmCallback = callback;
    }

    // 隐藏确认对话框
    function hideConfirmDialog() {
      document.getElementById('confirmDialog').style.display = 'none';
      confirmCallback = null;
    }

    // 确认操作
    function confirmAction() {
      if (confirmCallback) {
        confirmCallback();
      }
      hideConfirmDialog();
    }

    // ESC键关闭对话框
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        hideAddNovelDialog();
        hideConfirmDialog();
      }
    });

    // 点击对话框外部关闭
    document.getElementById('addNovelDialog').addEventListener('click', function(event) {
      if (event.target === this) {
        hideAddNovelDialog();
      }
    });

    document.getElementById('confirmDialog').addEventListener('click', function(event) {
      if (event.target === this) {
        hideConfirmDialog();
      }
    });
  </script>
</body>
</html>
