<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookCoverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#bookGradient)" />
  
  <!-- Book illustration -->
  <g transform="translate(75, 80)">
    <!-- Book shadow -->
    <rect x="5" y="5" width="145" height="200" rx="8" fill="rgba(0,0,0,0.2)" />
    
    <!-- Book cover -->
    <rect x="0" y="0" width="145" height="200" rx="8" fill="url(#bookCoverGradient)" stroke="#4f46e5" stroke-width="2" />
    
    <!-- Book spine lines -->
    <line x1="15" y1="30" x2="130" y2="30" stroke="#4f46e5" stroke-width="1.5" opacity="0.6" />
    <line x1="15" y1="50" x2="130" y2="50" stroke="#4f46e5" stroke-width="1.5" opacity="0.6" />
    <line x1="15" y1="70" x2="130" y2="70" stroke="#4f46e5" stroke-width="1.5" opacity="0.6" />
    
    <!-- Book icon -->
    <g transform="translate(60, 110)">
      <rect x="-12" y="-15" width="24" height="20" rx="2" fill="#4f46e5" opacity="0.8" />
      <rect x="-10" y="-13" width="20" height="16" rx="1" fill="white" />
      <line x1="-6" y1="-9" x2="6" y2="-9" stroke="#4f46e5" stroke-width="1" />
      <line x1="-6" y1="-5" x2="6" y2="-5" stroke="#4f46e5" stroke-width="1" />
      <line x1="-6" y1="-1" x2="6" y2="-1" stroke="#4f46e5" stroke-width="1" />
    </g>
  </g>
  
  <!-- Text -->
  <text x="150" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="500">
    無封面圖片
  </text>
  <text x="150" y="340" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12">
    No Cover Available
  </text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="350" r="3" fill="rgba(255,255,255,0.3)" />
  <circle cx="250" cy="50" r="4" fill="rgba(255,255,255,0.2)" />
  <circle cx="270" cy="350" r="2" fill="rgba(255,255,255,0.4)" />
</svg>
