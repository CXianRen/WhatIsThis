<!DOCTYPE html>
<html>
<head>
  <title>DAG Visualization</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    #mynetwork {
      width: 800px; height: 600px; border: 1px solid lightgray;
    }
  </style>
</head>
<body>
<h3>DAG Visualization</h3>
<div id="mynetwork"></div>

<script>
  // 后端返回的 JSON 数据示例，替换成后端接口调用结果即可
  const data = {
    nodes: [
      {id: 'must', label: 'must'},
      {id: 'moist', label: 'moist'},
      {id: 'moisture', label: 'moisture'},
      {id: 'damp', label: 'damp'},
      {id: 'wet', label: 'wet'},
      {id: 'humid', label: 'humid'},
      {id: 'humidity', label: 'humidity'},
      {id: 'musty', label: 'musty'},
      {id: 'mustiness', label: 'mustiness'},
      {id: 'mold', label: 'mold'},
      {id: 'moldy', label: 'moldy'}
    ],
    edges: [
      {from: 'must', to: 'moist'},
      {from: 'moist', to: 'moisture'},
      {from: 'moisture', to: 'damp'},
      {from: 'moisture', to: 'wet'},
      {from: 'moisture', to: 'humid'},
      {from: 'humid', to: 'humidity'},
      {from: 'must', to: 'musty'},
      {from: 'musty', to: 'mustiness'},
      {from: 'mustiness', to: 'mold'},
      {from: 'mold', to: 'moldy'}
    ]
  };

  const container = document.getElementById('mynetwork');
  const options = {
    layout: {
      hierarchical: {
        direction: 'UD',  // 上到下
        sortMethod: 'directed'
      }
    },
    edges: {
      arrows: 'to',
      smooth: true
    },
    physics: false
  };

  const network = new vis.Network(container, data, options);
</script>
</body>
</html>
