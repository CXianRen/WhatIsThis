<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT 代理 API 示例</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    textarea { width: 100%; height: 100px; }
    #output { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h2>ChatGPT API 示例</h2>
  <label>你的提问：</label><br>
  <textarea id="input">你好，请介绍一下你自己。</textarea><br>
  <button onclick="send()">发送</button>

  <div id="output">等待回复...</div>

  <script>
    const API_KEY = "sk-F4Oe5MiaApayE1x4771f24E4E2C54e2dB82185589dAc427e";  // ⚠️ 替换成你的 Key
    const API_URL = "https://free.v36.cm/v1/chat/completions";

    async function send() {
      const input = document.getElementById("input").value;
      const output = document.getElementById("output");
      output.textContent = "等待回复...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "user", content: input }
            ]
          })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error("HTTP " + res.status + ": " + err);
        }

        const data = await res.json();
        output.textContent = data.choices?.[0]?.message?.content || "无内容返回";
      } catch (e) {
        output.textContent = "出错了：" + e.message;
      }
    }
  </script>
</body>
</html>
