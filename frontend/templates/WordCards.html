<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Cards - WhatIsThis</title>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#667eea">

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Novel Reader">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 320px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
    }

    .filter-section {
      padding: 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .filter-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }

    .available-tags,
    .selected-tags {
      margin-bottom: 15px;
    }

    .tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      min-height: 32px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      border: 1px dashed #ddd;
    }

    .tag-btn {
      padding: 4px 10px;
      border: 1px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 15px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.3s ease;
    }

    .tag-btn:hover {
      background: #f0f4ff;
    }

    .selected-tag {
      padding: 4px 10px;
      background: #667eea;
      color: white;
      border-radius: 15px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .remove-tag {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-tag:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .filter-btn {
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-bottom: 15px;
    }

    .filter-btn:hover {
      background: #5a6fd8;
    }

    .filter-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .word-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .word-item {
      padding: 12px 15px;
      margin-bottom: 5px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
    }

    .word-item:hover {
      background: rgba(102, 126, 234, 0.1);
      border-left-color: #667eea;
    }

    .word-item.active {
      background: rgba(102, 126, 234, 0.2);
      border-left-color: #667eea;
    }

    .word-text {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .word-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .word-tag {
      padding: 2px 6px;
      background: #667eea;
      color: white;
      border-radius: 10px;
      font-size: 10px;
    }

    /* Main Content Styles */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
    }

    .toolbar {
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .nav-btn:hover {
      background: #5a6fd8;
    }

    .nav-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .word-card {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      justify-content: center;
      max-width: 800px;
      width: 100%;
    }

    .word-display {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 30px;
    }

    .word-title {
      font-size: 48px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }


    /* Image Viewer Styles */
    .image-viewer {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
      border-radius: 8px;
      background: #f8f9fa;
    }

    .image-slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .image-slide.active {
      display: block;
    }

    .image-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .image-btn {
      padding: 8px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .image-indicators {
      display: flex;
      gap: 8px;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .indicator.active {
      background: #667eea;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        width: 280px;
      }

      .word-title {
        font-size: 36px;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 240px;
      }

      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 200px;
      }

      .word-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Left Panel (Sidebar) -->
    <div class="sidebar" id="sidebar">
      <!-- Filter Section -->
      <div class="filter-section">
        <div class="available-tags">
          <h4 class="filter-title">All Tags</h4>
          <div class="tag-filter" id="availableTags">
            <!-- Available tags will be loaded here -->
          </div>
        </div>

        <div class="selected-tags">
          <h4 class="filter-title">Selected Tags</h4>
          <div class="tag-filter" id="selectedTags">
            <!-- Selected tags will show here -->
          </div>
        </div>

        <button class="filter-btn" id="filterBtn">Filter</button>
      </div>

      <!-- Words List -->
      <div class="word-list" id="wordList">
        <!-- Words will be loaded here -->
      </div>
    </div>

    <!-- Right Word Card -->
    <div class="main-content">
      <!-- Word Card Content -->
      <div class="word-card">
        <div class="word-display">
          <h1 class="word-title" id="wordTitle">apple</h1>
        </div>

        <!-- Image Viewer Component -->
        <div class="image-viewer" id="imageViewer">
          <!-- viewer component -->
        </div>

        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">
          <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn">Prev</button>
            <button class="nav-btn" id="nextBtn">Next</button>
          </div>
          <div class="toolbar-actions">
            <!-- Toolbar from toolbarModule.js will be inserted here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/toolbarModule.js"></script>
  <script src="/static/js/imageViewerModule.js"></script>

  <script>
    // WordCard Data and State
    let currentWordIndex = 0;
    let words = [];
    let selectedTags = [];
    let availableTags = [];
    let searchQuery = '';

    // fetch available tags from the server
    async function fetchTags() {
      try {
        const response = await fetch('/api/vocb/tags');
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const data = await response.json();
        availableTags = data.tags || [];
        updateAvailableTags();
      } catch (error) {
        console.error('Failed to fetch tags:', error);
        // availableTags = ['noun', 'verb', 'adjective', 'important', 'difficult']; // fallback
        // updateAvailableTags();
      }
    }

    // fetch words from the server
    async function fetchWords(tags = []) {
      try {
        const response = await fetch('/api/vocb/word/filter', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ tags })
        });

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const data = await response.json();
        words = Array.isArray(data) ? data : [];
        console.log('Fetched words:', words);
        updateWordList();
        updateWordCard();
      } catch (error) {
        console.error('Failed to fetch words:', error);
        words = []; // fallback to empty array
      }
    }

    function updateAvailableTags() {
      const availableTagsContainer = document.getElementById('availableTags');
      const tagsToShow = availableTags.filter(tag => !selectedTags.includes(tag));

      availableTagsContainer.innerHTML = tagsToShow.map(tag =>
        `<button class="tag-btn" data-tag="${tag}">${tag}</button>`
      ).join('');
    }

    function updateSelectedTags() {
      const selectedTagsContainer = document.getElementById('selectedTags');

      selectedTagsContainer.innerHTML = selectedTags.map(tag =>
        `<div class="selected-tag">
          ${tag}
          <button class="remove-tag" data-tag="${tag}">×</button>
        </div>`
      ).join('');
    }

    function addTag(tag) {
      if (!selectedTags.includes(tag)) {
        selectedTags.push(tag);
        updateAvailableTags();
        updateSelectedTags();
      }
    }

    function removeTag(tag) {
      selectedTags = selectedTags.filter(t => t !== tag);
      updateAvailableTags();
      updateSelectedTags();
    }


    function updateWordList() {
      const wordList = document.getElementById('wordList');
      wordList.innerHTML = words.map((word, index) => `
        <div class="word-item ${index === currentWordIndex ? 'active' : ''}" data-word-id="${word.id}">
          <div class="word-text">${word.word}</div>
          <div class="word-tags">
            ${word.tags ? word.tags.map(tag => `<span class="word-tag">${tag}</span>`).join('') : ''}
          </div>
        </div>
      `).join('');
    }

    function selectWord(wordId) {
      const index = words.findIndex(word => word.id === wordId);
      if (index !== -1) {
        currentWordIndex = index;
        updateWordList();
        updateWordCard();
      }
    }

    // WordCard Functions
    function updateWordCard() {
      if (words.length === 0) return;

      console.log('Updating word card with current index:', currentWordIndex);
      const currentWord = words[currentWordIndex];
      console.log('Updating word card with current word:', currentWord);

      document.getElementById('wordTitle').textContent = currentWord.word;
      // 调用模块更新图片
      if (currentWord.images) {
        ImageViewerModule.setImages(currentWord.images);
      }
      updateNavigationButtons();
    }

    function updateNavigationButtons() {
      document.getElementById('prevBtn').disabled = currentWordIndex === 0;
      document.getElementById('nextBtn').disabled = currentWordIndex === words.length - 1;
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 初始化 ImageViewerModule
      ImageViewerModule.init({
        cssUrl: '/static/css/image_viewer.css',
        containerId: 'imageViewer',
      });

      // 加載標籤和初始化
      fetchTags();

      // 綁定標籤點擊事件
      document.getElementById('availableTags').addEventListener('click', (e) => {
        if (e.target.classList.contains('tag-btn')) {
          addTag(e.target.dataset.tag);
        }
      });

      document.getElementById('selectedTags').addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-tag')) {
          removeTag(e.target.dataset.tag);
        }
      });

      // 綁定篩選按鈕事件
      document.getElementById('filterBtn').addEventListener('click', () => {
        const filterBtn = document.getElementById('filterBtn');
        filterBtn.disabled = true;

        fetchWords(selectedTags)
          .finally(() => {
            filterBtn.disabled = false;
          });
      });

      // 绑定单词列表点击事件
      document.getElementById('wordList').addEventListener('click', (e) => {
        const wordItem = e.target.closest('.word-item');
        if (wordItem) {
          selectWord(parseInt(wordItem.dataset.wordId));
        }
      });

      // 绑定按钮事件
      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentWordIndex > 0) {
          currentWordIndex--;
          updateWordList();
          updateWordCard();
        }
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentWordIndex < words.length - 1) {
          currentWordIndex++;
          updateWordList();
          updateWordCard();
        }
      });
    });

  </script>
</body>

</html>
