<!DOCTYPE html>
<html lang="zh-cn" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · WhatIsThis</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <meta name="theme-color" content="#667eea" />
  <style>
    :root {
      --bg: #0b0c10;         /* dark default for system */
      --card: #151923;
      --text: #e8ecf1;
      --muted: #a9b1bd;
      --primary: #667eea;
      --border: #232837;
      --ring: rgba(102, 126, 234, 0.5);
    }

    /* Light theme variables */
    [data-theme="light"]:root,
    :root[data-theme="light"] {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #4f46e5;
      --border: #e5e7eb;
      --ring: rgba(79, 70, 229, 0.2);
    }

    /* Dark theme variables */
    [data-theme="dark"]:root,
    :root[data-theme="dark"] {
      --bg: #0b0c10;
      --card: #151923;
      --text: #e8ecf1;
      --muted: #a9b1bd;
      --primary: #667eea;
      --border: #232837;
      --ring: rgba(102, 126, 234, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 980px;
      margin: 24px auto 64px;
      padding: 0 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .card {
      grid-column: span 12;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,.06);
    }

    @media (min-width: 900px) {
      .card { grid-column: span 6; }
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .row { 
      display: grid; 
      grid-template-columns: 1fr auto; 
      gap: 12px; 
      align-items: center; 
      padding: 10px 0; 
    }
    .row + .row { border-top: 1px dashed var(--border); }
    .desc { color: var(--muted); font-size: 12px; }

    select, input[type="number"], input[type="text"], button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease, transform .05s ease;
    }

    select:focus, input:focus, button:focus { box-shadow: 0 0 0 4px var(--ring); }

    .btn {
      background: var(--primary);
      border-color: transparent;
      color: white;
      cursor: pointer;
    }

    .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn.danger { background: #dc2626; }

    .toggle {
      --w: 44px; --h: 26px; --p: 3px;
      width: var(--w); height: var(--h);
      border-radius: 999px; position: relative; cursor: pointer;
      background: #4b5563; transition: background .2s ease;
    }
    .toggle[data-on="true"] { background: var(--primary); }
    .knob {
      position: absolute; inset: var(--p) auto var(--p) var(--p);
      width: calc(var(--h) - var(--p) * 2); height: calc(var(--h) - var(--p) * 2);
      background: #fff; border-radius: 999px; transition: left .2s ease, transform .2s ease;
      left: var(--p);
    }
    .toggle[data-on="true"] .knob { left: calc(var(--w) - var(--h) + var(--p)); }

    .kbd { 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
      background: var(--bg); 
      padding: 2px 6px; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      font-size: 12px; 
    }

    .footer {
      margin-top: 24px; 
      color: var(--muted); 
      font-size: 12px; 
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">⚙️ Settings </div>
        <div class="sub">These settings are saved in <span class="kbd">localStorage</span> and will take effect on all pages (reading the same key names).</div>
      </div>
      <a class="btn ghost" href="/">← Back to Home</a>
    </div>

    <div class="grid" id="settingsContainer">
      <!-- Settings panels will be dynamically generated here -->
    </div>

    <div class="footer">
      Tip: On other pages, please read keys like <span class="kbd">wit:lang</span> to apply settings.
    </div>
  </div>

  <script>
    // ========== Settings Framework ==========
    const PREFIX = 'wit:';
    let settingsConfig = null;
    let settingsData = new Map();

    // Storage Helper
    const Store = {
      get(key) {
        return localStorage.getItem(key);
      },
      set(key, value) {
        localStorage.setItem(key, value);
      },
      clearPrefix(prefix = PREFIX) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefix)) keys.push(k);
        }
        keys.forEach(k => localStorage.removeItem(k));
      }
    };

    // Settings Component Builders
    const ComponentBuilders = {
      select: (setting) => {
        const select = document.createElement('select');
        select.id = setting.id;
        
        setting.options.forEach(option => {
          const optionEl = document.createElement('option');
          optionEl.value = option.value;
          optionEl.textContent = option.text;
          select.appendChild(optionEl);
        });

        return select;
      },

      toggle: (setting) => {
        const toggle = document.createElement('div');
        toggle.className = 'toggle';
        toggle.id = setting.id;
        toggle.setAttribute('role', 'switch');
        toggle.setAttribute('aria-label', setting.title);
        toggle.setAttribute('tabindex', '0');
        
        const knob = document.createElement('div');
        knob.className = 'knob';
        toggle.appendChild(knob);

        return toggle;
      },

      action: (setting) => {
        const button = document.createElement('button');
        button.id = setting.id;
        button.className = setting.buttonClass || 'btn';
        button.textContent = setting.buttonText || setting.title;
        return button;
      }
    };

    // Panel Builder
    function buildSettingRow(setting) {
      const row = document.createElement('div');
      row.className = 'row';

      // Left side - title and description
      const leftDiv = document.createElement('div');
      const titleDiv = document.createElement('div');
      titleDiv.innerHTML = setting.title;
      
      const descDiv = document.createElement('div');
      descDiv.className = 'desc';
      descDiv.innerHTML = setting.desc;

      leftDiv.appendChild(titleDiv);
      leftDiv.appendChild(descDiv);

      // Right side - control
      const control = ComponentBuilders[setting.type](setting);
      
      row.appendChild(leftDiv);
      row.appendChild(control);

      return row;
    }

    function buildPanel(panel) {
      const section = document.createElement('section');
      section.className = 'card';
      section.id = `panel-${panel.id}`;

      const title = document.createElement('h3');
      title.textContent = panel.title;
      section.appendChild(title);

      panel.settings.forEach(setting => {
        const row = buildSettingRow(setting);
        section.appendChild(row);
      });

      return section;
    }

    // Event Handlers
    function bindSettingEvents(setting) {
      const element = document.getElementById(setting.id);
      if (!element) return;

      const storageKey = PREFIX + setting.id.replace(/([A-Z])/g, ':$1').toLowerCase();

      switch (setting.type) {
        case 'select':
          element.addEventListener('change', (e) => {
            Store.set(storageKey, e.target.value);
          });
          break;

        case 'toggle':
          element.addEventListener('click', () => {
            const currentValue = element.dataset.on === 'true';
            const newValue = !currentValue;
            setToggle(element, newValue);
            Store.set(storageKey, String(newValue));
          });
          
          element.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              element.click();
            }
          });
          break;

        case 'action':
          if (setting.action === 'resetToDefaults') {
            element.addEventListener('click', () => {
                if (!confirm('Are you sure you want to reset to defaults? This will clear all wit:* related settings.')) return;
              Store.clearPrefix();
              ensureDefaults();
              initializeUI();
            });
          }
          break;
      }
    }

    // UI Helpers
    function setToggle(element, value) {
      element.dataset.on = value ? 'true' : 'false';
    }

    function getToggle(element) {
      return element.dataset.on === 'true';
    }

    // Initialize settings values
    function initializeSettingValue(setting) {
      const element = document.getElementById(setting.id);
      if (!element) return;

      const storageKey = PREFIX + setting.id.replace(/([A-Z])/g, ':$1').toLowerCase();
      const storedValue = Store.get(storageKey);
      const defaultValue = setting.default;

      switch (setting.type) {
        case 'select':
          element.value = storedValue || defaultValue;
          break;
        case 'toggle':
          const boolValue = storedValue ? storedValue === 'true' : defaultValue;
          setToggle(element, boolValue);
          break;
      }
    }

    // Ensure default values exist
    function ensureDefaults() {
      if (!settingsConfig) return;

      settingsConfig.panels.forEach(panel => {
        panel.settings.forEach(setting => {
          if (setting.type === 'action') return; // Skip action buttons

          const storageKey = PREFIX + setting.id.replace(/([A-Z])/g, ':$1').toLowerCase();
          if (Store.get(storageKey) === null) {
            Store.set(storageKey, String(setting.default));
          }
        });
      });
    }

    // Initialize the entire UI
    function initializeUI() {
      if (!settingsConfig) return;

      const container = document.getElementById('settingsContainer');
      container.innerHTML = '';

      // Build panels
      settingsConfig.panels.forEach(panel => {
        const panelElement = buildPanel(panel);
        container.appendChild(panelElement);

        // Bind events for this panel
        panel.settings.forEach(setting => {
          bindSettingEvents(setting);
        });
      });

      // Initialize values
      settingsConfig.panels.forEach(panel => {
        panel.settings.forEach(setting => {
          initializeSettingValue(setting);
        });
      });
    }

    // Load configuration and initialize
    async function loadConfiguration() {
      try {
        const response = await fetch('/static/settings-config.json');
        settingsConfig = await response.json();
        
        ensureDefaults();
        initializeUI();
        
        console.log('Settings framework initialized successfully');
      } catch (error) {
        console.error('Failed to load settings configuration:', error);
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadConfiguration);
    } else {
      loadConfiguration();
    }
  </script>
</body>
</html>
