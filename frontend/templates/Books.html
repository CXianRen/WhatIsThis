<!DOCTYPE html>
<html lang="zh-cn" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 書庫 · WhatIsThis</title>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#667eea">

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Books Library">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- CSS Modules -->
  <link rel="stylesheet" href="/static/css/bookPage/base.css">
  <link rel="stylesheet" href="/static/css/bookPage/filter.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookCard.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookDetail.css">
  
  <!-- Simplified Header and Filter Styles -->
  <style>
    /* Simplified Header Styles for Mobile Optimization */
    .header-simplified {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .header-content-simplified {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-section-simplified {
      flex: 1;
    }

    .page-title-simplified {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title-icon-simplified {
      font-size: 1.25rem;
    }

    .nav-link-simplified {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .nav-link-simplified:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Optimized Filter Styles */
    .filter-section {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
    }

    .filter-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      flex: 1;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .filter-select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--card);
      color: var(--text);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      min-width: 120px;
    }

    .filter-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .search-container {
      position: relative;
      min-width: 200px;
      flex: 1;
      max-width: 300px;
    }

    .search-input {
      width: 100%;
      padding: 0.5rem 0.75rem 0.5rem 2.25rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--card);
      color: var(--text);
      font-size: 0.875rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-container::before {
      content: "🔍";
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 0.25rem;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    .search-clear:hover {
      background: var(--border);
      color: var(--text);
    }

    .filter-clear {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .filter-clear:hover:not(:disabled) {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-clear:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .filter-summary {
      width: 100%;
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .result-count {
      font-weight: 600;
      color: var(--text);
    }

    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-tag {
      background: var(--primary);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .header-simplified {
        padding: 0.5rem 0;
      }
      
      .header-content-simplified {
        padding: 0 0.75rem;
      }
      
      .page-title-simplified {
        font-size: 1.25rem;
      }
      
      .title-icon-simplified {
        font-size: 1.125rem;
      }
      
      .nav-link-simplified {
        padding: 0.4rem 0.75rem;
        font-size: 0.8rem;
      }

      .filter-container {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
        padding: 0 0.75rem;
      }

      .filter-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }

      .filter-group {
        flex-direction: column;
        align-items: stretch;
        gap: 0.25rem;
      }

      .search-container {
        min-width: auto;
        max-width: none;
      }

      .filter-summary {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .header-content-simplified {
        padding: 0 0.5rem;
      }
      
      .page-title-simplified {
        font-size: 1.125rem;
      }
      
      .nav-link-simplified {
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
      }

      .filter-container {
        padding: 0 0.5rem;
      }
    }
  </style>
</head>

<body>
  <!-- Main App Container -->
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="header-simplified">
      <div class="header-content-simplified">
        <div class="title-section-simplified">
          <h1 class="page-title-simplified">
            <span class="title-icon-simplified">📚</span>
            書庫
          </h1>
        </div>
        <nav class="header-nav-simplified">
          <a href="/" class="nav-link-simplified">
            ← 返回
          </a>
        </nav>
      </div>
    </header>

    <!-- Filter Section -->
    <section class="filter-section">
      <div id="book-filter" class="filter-container"></div>
    </section>

    <!-- Books Grid -->
    <main class="main-content">
      <div id="book-list" class="books-grid"></div>
      
      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">📖</div>
        <h3>暫無書籍</h3>
        <p>沒有找到符合篩選條件的書籍</p>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="loading-state">
        <div class="loading-spinner"></div>
        <p>正在載入書籍...</p>
      </div>
    </main>
  </div>

  <!-- Book Detail Modal -->
  <div id="book-detail-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div id="book-detail" class="book-detail-container"></div>
    </div>
  </div>

  <!-- ES Module Scripts -->
  <script type="module" src="/static/js/bookPage/booksPage.js"></script>

  <script type="module">
    // Initialize theme based on user preference using ES modules
    import { ThemeUtils } from '/static/js/bookPage/utils.js';
    
    const theme = ThemeUtils.getTheme();
    ThemeUtils.applyTheme(theme);
    
    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (theme === 'system') {
        ThemeUtils.applyTheme('system');
      }
    });
    
    // Log successful initialization
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        console.log('📚 Books page loaded successfully with ES modules');
      });
    } else {
      console.log('📚 Books page loaded successfully with ES modules');
    }
  </script>

  <!-- PWA Script -->
  <script src="/static/pwa.js"></script>
</body>
</html>
