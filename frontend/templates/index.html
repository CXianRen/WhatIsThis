<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description" content="Find real-world pronunciation examples with YouGlish.">
    <title>AIDict · YouGlish</title>
    <link rel="preconnect" href="https://youglish.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preload" href="https://youglish.com/public/emb/widget.js" as="script">
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("aidict.theme.v1");
        } catch {
          // The system theme is used when browser storage is unavailable.
        }
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#101411" : "#f5f2eb";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-bar">
          <div class="app-brand">
            <h1 class="app-title">AIDict</h1>
            <p class="app-version" aria-label="Version {{ app_version }}">v{{ app_version }}</p>
          </div>
          <div class="header-actions">
            <div class="locale-controls" role="group" aria-label="Search language and accent">
              <button id="language-button" class="locale-trigger" type="button" aria-label="Language: English" aria-haspopup="menu" aria-controls="locale-options" aria-expanded="false">
                <img id="language-flag" class="language-flag" src="/static/flags/gb.svg" alt="" width="28" height="19">
                <svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"></path></svg>
              </button>
              <button id="accent-button" class="locale-trigger" type="button" aria-label="Accent: All" aria-haspopup="menu" aria-controls="locale-options" aria-expanded="false">
                <span id="accent-label">All</span>
                <svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"></path></svg>
              </button>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
              <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"></path>
              </svg>
              <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.5"></circle>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
              </svg>
            </button>
            <div id="locale-panel" class="locale-panel" hidden>
              <p id="locale-panel-title" class="locale-panel-title">Language</p>
              <div id="locale-options" class="locale-options" role="menu" aria-labelledby="locale-panel-title"></div>
            </div>
          </div>
        </div>
      </header>

      <section class="search-card" aria-labelledby="search-title">
        <h2 id="search-title" class="sr-only">YouGlish search</h2>

        <form id="search-form" class="search-form" autocomplete="off">
          <label class="sr-only" for="query">Word or phrase</label>
          <div class="search-row">
            <input
              id="query"
              name="query"
              type="search"
              inputmode="search"
              enterkeyhint="search"
              placeholder="Search a word or phrase"
              maxlength="160"
              aria-controls="history-panel"
              aria-expanded="false"
              required
            >
            <button type="submit" aria-label="Search YouGlish">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
            </button>
          </div>

          <div id="history-panel" class="history-panel" hidden>
            <div class="history-heading">
              <span>Recent searches</span>
              <button id="clear-history" class="clear-history" type="button">Clear</button>
            </div>
            <ul id="history-list" class="history-list" aria-label="Recent searches"></ul>
            <p id="empty-history" class="empty-history">Your searches will appear here.</p>
          </div>
        </form>
      </section>

      <section id="results" class="results" aria-labelledby="result-title">
        <h2 id="result-title" class="result-title">Ready to search</h2>
        <p id="status" class="status" role="status" aria-live="polite">Enter a word or phrase above.</p>
        <div class="player-stage">
          <div id="youglish-widget" class="youglish-widget" hidden>
            <p class="player-placeholder" aria-hidden="true">Loading video…</p>
          </div>

          <div id="player-toolbar" class="player-toolbar" hidden>
            <div class="player-meta">
              <span id="track-position">0 / 0</span>
              <span id="playback-state">Ready</span>
            </div>

            <div class="transport-controls" aria-label="Playback controls">
              <button id="previous-button" class="player-action" type="button" aria-label="Previous example" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m18 5-9 7 9 7z"></path>
                  <path d="M6 5v14"></path>
                </svg>
              </button>
              <button id="back-button" class="player-action seek-button" type="button" aria-label="Back 5 seconds" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 8H3V4"></path>
                  <path d="M4 8a9 9 0 1 1-1 7"></path>
                </svg>
                <span>5</span>
              </button>
              <button id="play-button" class="player-action play-button" type="button" aria-label="Play" disabled>
                <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m8 5 11 7-11 7z"></path>
                </svg>
                <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5v14M16 5v14"></path>
                </svg>
              </button>
              <button id="forward-button" class="player-action seek-button" type="button" aria-label="Forward 5 seconds" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M17 8h4V4"></path>
                  <path d="M20 8a9 9 0 1 0 1 7"></path>
                </svg>
                <span>5</span>
              </button>
              <button id="next-button" class="player-action" type="button" aria-label="Next example" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m6 5 9 7-9 7z"></path>
                  <path d="M18 5v14"></path>
                </svg>
              </button>
            </div>

            <div class="secondary-controls">
              <button id="replay-button" class="player-action control-pill" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 8H3V4"></path>
                  <path d="M4 8a9 9 0 1 1-1 7"></path>
                </svg>
                Replay
              </button>
              <button id="speed-button" class="player-action control-pill" type="button" disabled>
                Speed <strong id="speed-label">1×</strong>
              </button>
            </div>
          </div>
        </div>

        <footer class="provider-links">
          <a href="https://youglish.com" target="_blank" rel="noopener noreferrer">Powered by YouGlish.com</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener noreferrer">YouTube Terms</a>
          <span aria-hidden="true">·</span>
          <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Google Privacy</a>
        </footer>
      </section>
    </main>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
