<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatIsThis - 多功能学习平台</title>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#667eea">

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WhatIsThis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#667eea">
  <meta name="msapplication-tap-highlight" content="no">

  <link rel="stylesheet" href="/static/css/nav.css">
</head>
<body>
  <div class="nav-container">
    <h2>WhatIsThis</h2>
    <ul class="nav-grid" id="navGrid">
      <!-- JS 动态生成 -->
    </ul>
  </div>

  <script>
    // 定义 app 配置
    const apps = [
      {
        href: "/lwi",
        icon: "🖼️",
        title: "Learn with Image",
        description: "Learn vocabulary through images, intuitively understand word meanings",
      },
      {
        href: "/lwg",
        icon: "📚",
        title: "Learn with Group Words",
        description: "Learn related words in groups for systematic memorization",
      },
      {
        href: "/word-cards",
        icon: "🎴",
        title: "Word Cards",
        description: "Review your vocabulary",
      },
      {
        href: "/novel-reader",
        icon: "📖",
        title: "Novel Reader",
        description: "Immersive novel reading, learn in context",
      },
      {
        href: "/annotation",
        icon: "🏷️",
        title: "Annotation Mode",
        description: "Image annotation mode, generate and edit learning data",
      },
      {
        href: "/novel-upload",
        icon: "📝",
        title: "Manage Novel",
        description: "Manage novel chapters, upload and edit novel content",
      },
      {
        href: "/settings",
        icon: "⚙️",
        title: "Settings",
        description: "Configure your learning preferences and app settings", 
      },
      {
        href: "/books",
        icon: "📚",
        title: "Books",
        description: "Manage your book collection, add and edit books",
      }
    ];

    // 渲染函数
    function renderApps(appList) {
      const navGrid = document.getElementById("navGrid");
      navGrid.innerHTML = ""; // 清空旧内容
      appList.forEach(app => {
        const li = document.createElement("li");
        li.className = "nav-item";
        li.innerHTML = `
          <a href="${app.href}" class="nav-link">
            <div class="nav-icon">${app.icon}</div>
            <div class="nav-content">
              <div class="nav-title">${app.title}</div>
              <div class="nav-description">${app.description}</div>
            </div>
          </a>
        `;
        navGrid.appendChild(li);
      });
    }

    // 初始化
    renderApps(apps);
  </script>

  <!-- PWA Support Script -->
  <script src="/static/pwa.js"></script>
</body>
</html>
