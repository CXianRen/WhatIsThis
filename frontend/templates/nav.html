<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatIsThis - 多功能学习平台</title>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#667eea">

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WhatIsThis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#667eea">
  <meta name="msapplication-tap-highlight" content="no">

  <style>
    :root {
      --bg-color: linear-gradient(135deg, #232946 0%, #393e46 100%);
      --text-color: #f3f6fa;
    }
  </style>

  <link rel="stylesheet" href="/static/css/navBar.css">
  <link rel="stylesheet" href="/static/css/infoPanel.css">

  <link rel="stylesheet" href="/static/css/bookPage/filter.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookCard.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookDetail.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookShelfPanel.css">
  <link rel="stylesheet" href="/static/css/reader/readerPanel.css">

  <link rel="stylesheet" href="/static/css/learnPanel.css">
  <link rel="stylesheet" href="/static/css/wordcard/wordcardPanel.css">
  <link rel="stylesheet" href="/static/css/wordcard/image_viewer.css">

  <link rel="stylesheet" href="/static/css/setting/setting.css">
  <link rel="stylesheet" href="/static/css/user/login.css">
  <link rel="stylesheet" href="/static/css/user/signup.css">

  <style>
    html {
      background: var(--bg-color);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      /* Change to your desired background color */
    }

    .nav-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      z-index: 1000;
      /* Ensure it stays on top */
    }

    .page-panel {
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      /* align-items: center; */
      /* justify-content: center; */
      width: 100%;
      height: calc(100vh - 40px);
      /* Adjust height to account for the nav bar */
      /* overflow-y: auto; */
      /* Adjust for navigation bar height */
      /* padding: 20px; */
      box-sizing: border-box;
      overflow-y: auto;
    }

    .full-screen {
      height: 100vh;
    }
  </style>
</head>

<body>
  <div class="page-panel home" style="display: none;"> </div>
  <div class="page-panel learn" style="display: none;"> </div>
  <div class="page-panel shelf" style="display: none;"> </div>
  <div class="page-panel library" style="display: none;"> </div>
  <div class="page-panel reader full-screen" style="display: none;"> </div>
  <div class="page-panel wordcard full-screen" style="display: none;"> </div>
  <div class="page-panel setting" style="display: none;"> </div>
  <div class="page-panel login full-screen" style="display: none;"> </div>
  <div class="page-panel signup full-screen" style="display: none;"> </div>

  <div class="nav-bar-container"></div>
  <script type="module">
    import { registerNavBar, registerPath, toPath } from '/static/js/router/router.js';
    import { createNavigationBar } from '/static/js/navBar.js';
    import InfoPanel from '/static/js/infoPanel.js';
    import LearnPanel from '/static/js/learnPanel.js';
    import BookShelfPanel from '/static/js/bookPage/bookShelfPanel.js';
    import BookLibraryPanel from '/static/js/bookPage/bookLibPanel.js';
    import { createReaderPanel } from '/static/js/reader/readerPanel.js';
    import WordCardPanel from '/static/js/wordcard/wordcardPanel.js';
    import { LoginPanel, SignUpPanel } from '/static/js/user/login.js';

    import SettingPanel from '/static/js/setting/setting.js';

    window.addEventListener('DOMContentLoaded', () => {
      registerNavBar(document.querySelector('.nav-bar-container'));

      createNavigationBar(document.querySelector('.nav-bar-container'),
        [
          {
            cb: () => {
              toPath('shelf');
            },
            icon: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
          <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22h13"></path>
          <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2h13v20h-13A2.5 2.5 0 0 1 4 19.5z"></path>
        </svg>
      `
          },
          {
            // url: '/learn',
            cb: () => {
              toPath('learn');
            },
            icon: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
          <path d="M12 2L1 7l11 5 9-4.09V17h2V7L12 2z"></path>
          <path d="M12 22v-7"></path>
          <path d="M9 20h6"></path>
        </svg>
      `
          },
          {
            cb: () => {
              toPath('home');
            },
            icon: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
          <path d="M3 12L12 3l9 9"></path>
          <path d="M9 21V12h6v9"></path>
        </svg>
      `
          }
        ]);

      const login_panel = new LoginPanel(document.querySelector('.login'));
      const signup_panel = new SignUpPanel(document.querySelector('.signup'));
      registerPath('login', {
        fullscreen: true,
        requiresLogin: false,
        onMount: () => {
          login_panel.mount();
        },
        onUnmount: () => {
          login_panel.unmount();
        }
      });

      registerPath('signup', {
        fullscreen: true,
        requiresLogin: false,
        onMount: () => {
          signup_panel.mount();
        },
        onUnmount: () => {
          signup_panel.unmount();
        }
      });

      const info_panel = new InfoPanel(document.querySelector('.home'), {
        learnedDays: [1, 2, 3, 4, 7, 8, 9, 10],
        daysLearned: 30,
        wordsAdded: 150
      });

      registerPath('home', {
        requiresLogin: true,
        fullscreen: false,
        onMount: () => {
          info_panel.mount();
        },
        onUnmount: () => {
          // document.querySelector('.home').innerHTML = '';
          info_panel.unmount();
        }
      });

      const learn_panel = new LearnPanel(document.querySelector('.learn'));

      registerPath('learn', {
        onMount: () => {
          learn_panel.mount?.();
        },
        onUnmount: () => {
          learn_panel.unmount?.();
        }
      });


      const shelf_panel = new BookShelfPanel(document.querySelector('.shelf'));
      registerPath('shelf', {
        onMount: () => {
          shelf_panel.mount();
        },
        onUnmount: () => {
          shelf_panel.unmount();
        }
      });

      const lib_panel = new BookLibraryPanel(document.querySelector('.library'));
      registerPath('library', {
        onMount: () => {
          lib_panel.mount();
        },
        onUnmount: () => {
          lib_panel.unmount();
        }
      });

      registerPath('reader', {
        fullscreen: true,
        onMount: () => {
          createReaderPanel(document.querySelector('.reader'));
        },
        onUnmount: () => {
          document.querySelector('.reader').innerHTML = '';
        }
      });

      const wordcard_panel = new WordCardPanel(document.querySelector('.wordcard'));
      registerPath('wordcard', {
        fullscreen: true,
        onMount: () => {
          wordcard_panel.mount();
        },
        onUnmount: () => {
          wordcard_panel.unmount();
        }
      });


      const setting_panel = new SettingPanel(document.querySelector('.setting'));
      registerPath('setting', {
        onMount: () => {
          setting_panel.mount();
        },
        onUnmount: () => {
          setting_panel.unmount();
        }
      });
    });


  </script>


  <!-- PWA Support Script -->
  <script src="/static/pwa.js"></script>
</body>

</html>
