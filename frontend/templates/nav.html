<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatIsThis - 多功能学习平台</title>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#667eea">

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WhatIsThis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#667eea">
  <meta name="msapplication-tap-highlight" content="no">

  <style>
    :root {
      --bg-color: linear-gradient(135deg, #232946 0%, #393e46 100%);
      --text-color: #f3f6fa;
    }
  </style>

  <link rel="stylesheet" href="/static/css/navBar.css">
  <link rel="stylesheet" href="/static/css/infoPanel.css">

  <link rel="stylesheet" href="/static/css/bookPage/filter.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookCard.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookDetail.css">
  <link rel="stylesheet" href="/static/css/bookPage/bookShelfPanel.css">
  <link rel="stylesheet" href="/static/css/reader/readerPanel.css">

  <link rel="stylesheet" href="/static/css/learnPanel.css">
  <link rel="stylesheet" href="/static/css/wordcard/wordcardPanel.css">
  <link rel="stylesheet" href="/static/css/wordcard/image_viewer.css">

  <link rel="stylesheet" href="/static/css/setting/setting.css">
  <link rel="stylesheet" href="/static/css/user/login.css">
  <link rel="stylesheet" href="/static/css/user/signup.css">

  <link rel="stylesheet" href="/static/css/reader/word_panel.css">
  <link rel="stylesheet" href="/static/css/reader/youglish_panel.css">
  <link rel="stylesheet" href="/static/css/ai_dict/AIDictPanel.css">

  <style>
    html {
      background: var(--bg-color);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      /* Change to your desired background color */
    }

    .nav-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      z-index: 1000;
      /* Ensure it stays on top */
    }

    .page-panel {
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      /* align-items: center; */
      /* justify-content: center; */
      width: 100%;
      height: calc(100vh - 40px);
      /* Adjust height to account for the nav bar */
      /* overflow-y: auto; */
      /* Adjust for navigation bar height */
      /* padding: 20px; */
      box-sizing: border-box;
      overflow-y: auto;
    }

    .full-screen {
      height: 100vh;
    }
  </style>
</head>

<body>
  <div class="page-panel app" style="display: flex;"> </div>

  <div class="nav-bar-container"></div>
  <script type="module">
    import { routerInit, registerNavBar, registerPath, toPath } from '/static/js/router/router.js';
    import NavigationBar from '/static/js/navBar.js';
    import InfoPanel from '/static/js/infoPanel.js';
    import LearnPanel from '/static/js/learnPanel.js';
    import BookShelfPanel from '/static/js/bookPage/bookShelfPanel.js';
    import BookLibraryPanel from '/static/js/bookPage/bookLibPanel.js';
    import ReaderPanel from '/static/js/reader/readerPanel.js';
    import WordCardPanel from '/static/js/wordcard/wordcardPanel.js';
    import { LoginPanel, SignUpPanel } from '/static/js/user/login.js';
    import AIDictPanel from '/static/js/ai_dict/AIDictPanel.js';
    import SettingPanel from '/static/js/setting/setting.js';

    window.addEventListener('DOMContentLoaded', () => {

      const navBar = new NavigationBar({
        container: document.querySelector('.nav-bar-container'),
        pageList:
          [
            {
              cb: () => {
                toPath('shelf');
              },
              icon_url: '/static/imgs/nav/shelf.svg'
            }
            ,
            {
              cb: () => {
                toPath('learn');
              },
              icon_url: '/static/imgs/nav/learn.svg'
            },
            {
              cb: () => {
                toPath('home');
              },
              icon_url: '/static/imgs/nav/home.svg'
            }
          ]
      });

      routerInit(document.querySelector('.app'));
      registerNavBar(navBar);

      registerPath('login', LoginPanel, {
        fullscreen: true,
        requiresLogin: false,
      });

      registerPath('signup', SignUpPanel, {
        fullscreen: true,
        requiresLogin: false
      });

      registerPath('home', InfoPanel);
      registerPath('learn', LearnPanel);
      registerPath('shelf', BookShelfPanel);
      registerPath('library', BookLibraryPanel);
      registerPath('reader', ReaderPanel, { fullscreen: true });
      registerPath('wordcard', WordCardPanel, { fullscreen: true });
      registerPath('setting', SettingPanel);
      registerPath('AIDict', AIDictPanel);

    });


  </script>


  <!-- PWA Support Script -->
  <script src="/static/pwa.js"></script>
</body>

</html>
