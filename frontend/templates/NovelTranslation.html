<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说语言转换 - WhatIsThis</title>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.svg">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="stylesheet" href="/static/css/novel_ts.css">
  <meta name="theme-color" content="#667eea">

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="语言转换">
  <meta name="mobile-web-app-capable" content="yes">

</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🌍 Novel Language Translation</h1>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <a href="/novel-upload" class="nav-tab">📖 Chapter Management</a>
      <a href="/novel-translation" class="nav-tab active">🌍 Language Translation</a>
    </div>

    <div class="main-content">
      <!-- Left Panel - Novel and Chapter Selection -->
      <div class="left-panel">
        <!-- Novel Selection -->
        <div class="novel-selector">
          <h3 class="section-title">Select Novel</h3>
          <div id="novelList">
            <!-- Novel list will be generated here dynamically -->
          </div>
        </div>

        <!-- Chapter Selection -->
        <div class="chapter-selector">
          <h3 class="section-title">Select Chapters</h3>
          <div style="margin-bottom: 15px;">
            <label>
              <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
              Select All / Deselect All
            </label>
          </div>
          <div id="chapterList">
            <div class="empty-state">
              <div class="empty-icon">📖</div>
              <p>Please select a novel first</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel - Conversion Controls and Queue -->
      <div class="right-panel">
        <!-- Conversion Controls -->
        <div class="conversion-controls">
          <h3 class="section-title">Conversion Settings</h3>

          <div class="control-row">
            <div class="control-group">
              <label class="control-label">Target Language</label>
              <select id="targetLanguage" class="language-select">
                <option value="">Select Target Language</option>
              </select>
            </div>

            <div class="control-group">
              <label class="control-label">Overwrite Setting</label>
              <select id="overwriteMode" class="language-select" style="min-width: 150px;">
                <option value="ask">Ask to Overwrite</option>
                <option value="skip">Skip Existing</option>
                <option value="overwrite">Overwrite Directly</option>
              </select>
            </div>
          </div>

          <div class="batch-actions">
            <button class="btn btn-primary" onclick="startBatchConversion()" id="startBtn">
              🚀 Start Batch Conversion
            </button>
            <button class="btn btn-secondary" onclick="clearQueue()" id="clearBtn">
              🗑️ Clear Queue
            </button>
            <button class="btn btn-success" onclick="clearStoppedTasks()" id="clearStoppedBtn">
              🧹 Clear Stopped
            </button>
            <button class="btn btn-danger" onclick="stopAllTasks()" id="stopAllBtn">
              ⏹️ Stop All
            </button>
          </div>
        </div>

        <!-- Statistics -->
        <div class="stats-container">
          <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="waitingCount">0</div>
            <div class="stat-label">Waiting</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="processingCount">0</div>
            <div class="stat-label">Processing</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="failedCount">0</div>
            <div class="stat-label">Failed</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stoppedCount">0</div>
            <div class="stat-label">Stopped</div>
          </div>
        </div>

        <!-- Conversion Queue -->
        <div class="conversion-queue-section">
          <h3 class="section-title">Conversion Queue</h3>
          <div id="conversionQueue" class="conversion-queue">
            <div class="empty-state">
              <div class="empty-icon">📋</div>
              <p>The queue is empty, please add chapters to convert</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/novel_util.js"></script>
  <script>
    let novels = [];
    let currentNovel = null;
    let selectedChapters = new Set();
    let conversionQueue = [];
    let isProcessing = false;
    let supportedLanguages = {};


    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function () {
      loadSupportedLanguages();
      loadNovels();
    });

    // Load supported languages
    async function loadSupportedLanguages() {
      console.log('Start loading supported languages...');
      try {
        const response = await fetch('/api/supported-languages');
        if (response.ok) {
          supportedLanguages = await response.json();
          console.log('Supported languages:', supportedLanguages);
          initializeLanguageSelect();
        } else {
          console.error('Failed to load supported languages:', response.statusText);
        }
      } catch (error) {
        console.error('Failed to load supported languages:', error);
      }
    }

    // Initialize language select dropdown
    function initializeLanguageSelect() {
      const select = document.getElementById('targetLanguage');
      select.innerHTML = '<option value="">Select Target Language</option>';

      Object.keys(supportedLanguages).forEach(langCode => {
        if (langCode !== 'zh') { // Exclude Chinese as it is the source language
          const option = document.createElement('option');
          option.value = langCode;
          option.textContent = `${supportedLanguages[langCode].flag} ${supportedLanguages[langCode].name}`;
          select.appendChild(option);
        }
      });

      // Add language change listener
      select.addEventListener('change', function () {
        // When language changes, update chapter selection state
        if (currentNovel && currentNovel.chapters) {
          selectedChapters.clear();
          updateChapterSelection();
          updateSelectAllCheckbox();
        }
      });
    }

    // Load novel list
    async function loadNovels() {
      console.log('Start loading novel list...');
      try {
        const response = await fetch('/novel/list');
        if (response.ok) {
          novels = await response.json();
          console.log('Novel list:', novels);
        } else {
          console.error('Failed to load novel list:', response.statusText);
          novels = [];
        }
        renderNovelList();
      } catch (error) {
        console.error('Failed to load novel list:', error);
        novels = [];
        renderNovelList();
      }
    }

    // Render novel list
    function renderNovelList() {
      const novelList = document.getElementById('novelList');

      if (novels.length === 0) {
        novelList.innerHTML = `
        <div class="empty-state">
        <div class="empty-icon">📚</div>
        <p>No novels yet</p>
        </div>
      `;
        return;
      }

      novelList.innerHTML = novels.map(novel => `
      <div class="novel-item ${currentNovel?.name === novel.name ? 'active' : ''}" 
         onclick="selectNovel('${novel.name}')">
        <div class="novel-name">${novel.display_name || novel.name}</div>
        <div class="chapter-count">${novel.chapter_count || 0} chapters</div>
      </div>
      `).join('');
    }

    // Select novel
    async function selectNovel(novelName) {
      currentNovel = novels.find(n => n.name === novelName);
      renderNovelList();

      await loadChapters();

      // Show add chapter button
      document.getElementById('addChapterBtn').style.display = 'block';
      document.getElementById('defaultHint').querySelector('p').textContent =
        `Selected: ${currentNovel.display_name || currentNovel.name}`;
    }

    // Load chapter list
    async function loadChapters() {
      console.log("Loading chapter list");
      const chapterList = document.getElementById('chapterList');

      if (!currentNovel) {
        chapterList.innerHTML = `
        <div class="empty-state">
        <div class="empty-icon">📖</div>
        <p>Please select a novel first</p>
        </div>
      `;
        return;
      }

      try {
        const response = await fetch(`/novel/${currentNovel.name}/chapters`);
        if (response.ok) {
          const chapters = await response.json();
          console.log("Chapter data:", chapters);
          currentNovel.chapters = chapters;
        } else {
          console.error('Failed to load chapters:', response.statusText);
          currentNovel.chapters = [];
        }
      } catch (error) {
        console.error('Failed to load chapters:', error);
        currentNovel.chapters = [];
      }

      if (!currentNovel.chapters || currentNovel.chapters.length === 0) {
        chapterList.innerHTML = `
        <div class="empty-state">
        <div class="empty-icon">📖</div>
        <p>This novel has no chapters yet</p>
        </div>
      `;
        return;
      }

      chapterList.innerHTML = currentNovel.chapters.map(chapter => `
      <div class="chapter-item ${selectedChapters.has(chapter.cid) ? 'selected' : ''}" 
         data-chapter-id="${chapter.cid}"
         onclick="toggleChapterSelection(${chapter.cid})">
        <input type="checkbox" class="chapter-checkbox" 
           ${selectedChapters.has(chapter.cid) ? 'checked' : ''}
           onchange="event.stopPropagation(); toggleChapterSelection(${chapter.cid})">
        <div class="chapter-info">
        <div class="chapter-title">${chapter.title}</div>
        <div class="language-flags">
          ${renderLanguageFlags(chapter)}
        </div>
        </div>
      </div>
      `).join('');

      updateSelectAllCheckbox();
    }


    // 切换章节选择
    function toggleChapterSelection(chapterId) {
      const targetLanguage = document.getElementById('targetLanguage').value;

      if (!targetLanguage) {
        alert('Please select a target language first');
        return;
      }

      // Check if already in the queue
      const existingTaskIndex = conversionQueue.findIndex(
        task => task.novelName === currentNovel.name &&
          task.chapterId === chapterId &&
          task.targetLanguage === targetLanguage
      );

      if (existingTaskIndex !== -1) {
        // If already in the queue, remove (only if status is waiting)
        const task = conversionQueue[existingTaskIndex];

        // Only allow removing tasks that are not processing or queued
        if (task.status === 'processing' || task.status === 'queued') {
          alert('This chapter is being processed and cannot be removed');
          return;
        }

        conversionQueue.splice(existingTaskIndex, 1);
        selectedChapters.delete(chapterId);
        console.log('Removed task from queue:', task);
      } else {
        // If not in the queue, add it
        const chapter = currentNovel.chapters.find(c => c.cid === chapterId);
        if (chapter) {
          const task = {
            id: Date.now() + Math.random(),
            novelName: currentNovel.name,
            chapterId: chapterId,
            chapterTitle: chapter.title,
            targetLanguage: targetLanguage,
            targetLanguageName: supportedLanguages[targetLanguage].name,
            status: 'waiting',
            progress: 0,
            error: null,
            startTime: null,
            endTime: null
          };
          conversionQueue.push(task);
          selectedChapters.add(chapterId);
          console.log('Added task to queue:', task);
        }
      }

      // Update UI
      renderConversionQueue();
      updateStats();
      updateChapterSelection();
      updateSelectAllCheckbox();
    }

    function updateChapterSelection() {
      const targetLanguage = document.getElementById('targetLanguage').value;

      if (!currentNovel || !currentNovel.chapters) return;

      currentNovel.chapters.forEach(chapter => {
        const chapterItem = document.querySelector(`[data-chapter-id="${chapter.cid}"]`);
        const checkbox = chapterItem?.querySelector('.chapter-checkbox');

        if (chapterItem && checkbox) {
          // check if this chapter is in the conversion queue for the selected language
          const isInQueue = conversionQueue.some(
            task => task.novelName === currentNovel.name &&
              task.chapterId === chapter.cid &&
              task.targetLanguage === targetLanguage
          );

          if (isInQueue) {
            chapterItem.classList.add('selected');
            checkbox.checked = true;
            selectedChapters.add(chapter.cid);
          } else {
            chapterItem.classList.remove('selected');
            checkbox.checked = false;
            selectedChapters.delete(chapter.cid);
          }
        }
      });
    }

    function toggleSelectAll() {
      const selectAllCheckbox = document.getElementById('selectAll');
      const isSelectAll = selectAllCheckbox.checked;

      if (isSelectAll) {
        currentNovel.chapters.forEach(chapter => {
          const existingTask = conversionQueue.find(
            task => task.novelName === currentNovel.name &&
              task.chapterId === chapter.cid &&
              task.targetLanguage === targetLanguage
          );

          if (!existingTask) {
            const task = {
              id: Date.now() + Math.random(),
              novelName: currentNovel.name,
              chapterId: chapter.cid,
              chapterTitle: chapter.title,
              targetLanguage: targetLanguage,
              targetLanguageName: supportedLanguages[targetLanguage].name,
              status: 'waiting',
              progress: 0,
              error: null,
              startTime: null,
              endTime: null
            };
            conversionQueue.push(task);
          }
          selectedChapters.add(chapter.cid);
        });
      } else {
        // 取消全选 - 从队列中移除当前语言的所有章节
        const tasksToRemove = conversionQueue.filter(
          task => task.novelName === currentNovel.name &&
            task.targetLanguage === targetLanguage &&
            (task.status === 'waiting' || task.status === 'completed' || task.status === 'failed' || task.status === 'stopped')
        );

        if (tasksToRemove.length > 0) {
          const hasProcessingTasks = conversionQueue.some(
            task => task.novelName === currentNovel.name &&
              task.targetLanguage === targetLanguage &&
              (task.status === 'processing' || task.status === 'queued')
          );

          if (hasProcessingTasks) {
            alert('有正在处理的任务，无法全部移除');
            selectAllCheckbox.checked = true;
            return;
          }

          if (confirm(`确定要从队列中移除所有 ${supportedLanguages[targetLanguage].name} 翻译任务吗？`)) {
            // 移除任务
            tasksToRemove.forEach(task => {
              const index = conversionQueue.indexOf(task);
              if (index !== -1) {
                conversionQueue.splice(index, 1);
              }
            });
            selectedChapters.clear();
          } else {
            selectAllCheckbox.checked = true;
            return;
          }
        } else {
          selectedChapters.clear();
        }
      }

      // 更新UI
      renderConversionQueue();
      updateStats();
      updateChapterSelection();
      console.log('全选状态:', isSelectAll, '队列长度:', conversionQueue.length);
    }


    function updateSelectAllCheckbox() {
      const selectAllCheckbox = document.getElementById('selectAll');
      const targetLanguage = document.getElementById('targetLanguage').value;

      if (!currentNovel || !currentNovel.chapters || !targetLanguage) {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = false;
        return;
      }

      const chaptersInQueue = conversionQueue.filter(
        task => task.novelName === currentNovel.name &&
          task.targetLanguage === targetLanguage
      ).length;

      const totalChapters = currentNovel.chapters.length;

      if (chaptersInQueue === 0) {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = false;
      } else if (chaptersInQueue === totalChapters) {
        selectAllCheckbox.checked = true;
        selectAllCheckbox.indeterminate = false;
      } else {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = true;
      }
    }

    function renderConversionQueue() {
      const queueContainer = document.getElementById('conversionQueue');

      if (conversionQueue.length === 0) {
        queueContainer.innerHTML = `
        <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>The queue is empty, please add chapters to convert</p>
        </div>
      `;
        return;
      }

      queueContainer.innerHTML = conversionQueue.map(task => {
        let timeInfo = '';
        if (task.estimatedTime && task.estimatedTime > 0) {
          const minutes = Math.floor(task.estimatedTime / 60);
          const seconds = Math.floor(task.estimatedTime % 60);
          timeInfo = `<div class="estimated-time">Estimated remaining: ${minutes}m ${seconds}s</div>`;
        } else if (task.status === 'completed' && task.startTime && task.endTime) {
          const duration = Math.floor((task.endTime - task.startTime) / 1000);
          const minutes = Math.floor(duration / 60);
          const seconds = duration % 60;
          timeInfo = `<div class="duration-time">Duration: ${minutes}m ${seconds}s</div>`;
        }

        // Action buttons: only waiting/failed tasks can be removed, completed tasks show status
        let actionButton = '';
        if (task.status === 'waiting') {
          actionButton = `<button class="btn-remove" onclick="removeTask('${task.id}')">Remove</button>`;
        } else if (task.status === 'processing' || task.status === 'queued') {
          actionButton = `<span class="processing-indicator">Processing...</span>`;
        } else if (task.status === 'completed') {
          actionButton = `<span class="completed-indicator">✅ Completed</span>`;
        } else if (task.status === 'failed') {
          actionButton = `<button class="btn-remove" onclick="removeTask('${task.id}')">Remove</button>`;
        }

        return `
        <div class="queue-item ${task.status}" data-task-id="${task.id}">
        <div class="queue-info">
          <div class="queue-title">${task.chapterTitle}</div>
          <div class="queue-details">
          ${task.novelName} → ${task.targetLanguageName}
          </div>
          ${timeInfo}
          ${task.error ? `<div class="error-message">Error: ${task.error}</div>` : ''}
        </div>
        <div class="queue-status">
          <div class="status-text ${task.status}">
          ${getStatusText(task.status)}
          </div>
          <div class="progress-container">
          <div class="progress-bar ${task.status === 'completed' ? 'success' : task.status === 'failed' || task.status === 'stopped' ? 'error' : ''}" 
             style="width: ${task.progress}%"></div>
          </div>
          <div class="progress-percentage">${task.progress}%</div>
          ${actionButton}
        </div>
        </div>
      `;
      }).join('');
    }
    // Get status text
    function getStatusText(status) {
      const statusMap = {
        'waiting': 'Waiting',
        'queued': 'Queued',
        'processing': 'Processing',
        'completed': 'Completed',
        'failed': 'Failed',
        'stopped': 'Stopped'
      };
      return statusMap[status] || status;
    }

    // Update statistics
    function updateStats() {
      const stats = {
        total: conversionQueue.length,
        waiting: conversionQueue.filter(t => t.status === 'waiting' || t.status === 'queued').length,
        processing: conversionQueue.filter(t => t.status === 'processing').length,
        completed: conversionQueue.filter(t => t.status === 'completed').length,
        failed: conversionQueue.filter(t => t.status === 'failed').length,
        stopped: conversionQueue.filter(t => t.status === 'stopped').length
      };

      document.getElementById('totalCount').textContent = stats.total;
      document.getElementById('waitingCount').textContent = stats.waiting;
      document.getElementById('processingCount').textContent = stats.processing;
      document.getElementById('completedCount').textContent = stats.completed;
      document.getElementById('failedCount').textContent = stats.failed;
      document.getElementById('stoppedCount').textContent = stats.stopped;
    }

    // Start batch conversion - simple queue, execute one by one
    async function startBatchConversion() {
      if (conversionQueue.length === 0) {
        alert('The queue is empty, please add chapters to convert');
        return;
      }

      if (isProcessing) {
        alert('Conversion is in progress, please wait for the current task to finish');
        return;
      }

      console.log('Starting batch conversion, queue length:', conversionQueue.length);
      isProcessing = true;

      // Update button state
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').textContent = 'Converting...';

      // Start processing the first waiting task in the queue
      await processNextTask();

      // If all tasks are completed, restore button state
      if (!conversionQueue.some(t => t.status === 'waiting' || t.status === 'processing')) {
        isProcessing = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').textContent = '🚀 Start Batch Conversion';
        console.log('Batch conversion completed');
        alert('Batch conversion completed!');
      }
    }

    // Process the next task in the queue
    async function processNextTask() {
      // Find the next waiting task
      const nextTask = conversionQueue.find(t => t.status === 'waiting');

      if (!nextTask) {
        // No more waiting tasks, check if all tasks are done
        if (!conversionQueue.some(t => t.status === 'processing')) {
          // All tasks are done, restore UI state
          isProcessing = false;
          document.getElementById('startBtn').disabled = false;
          document.getElementById('startBtn').textContent = '🚀 Start Batch Conversion';
          console.log('Batch conversion completed');
          alert('Batch conversion completed!');
        }
        return;
      }

      console.log('Start processing next task:', nextTask);

      // Update task status to processing
      nextTask.status = 'processing';
      nextTask.progress = 0;
      nextTask.startTime = new Date();

      renderConversionQueue();
      updateStats();

      try {
        // Check overwrite mode
        const overwriteMode = document.getElementById('overwriteMode').value;
        const chapter = currentNovel?.chapters?.find(c => c.cid === nextTask.chapterId);

        if (chapter) {
          const support = getChapterLanguageSupport(chapter);
          const hasExistingVersion = support[nextTask.targetLanguage];

          if (hasExistingVersion && overwriteMode === 'skip') {
            nextTask.status = 'completed';
            nextTask.progress = 100;
            nextTask.endTime = new Date();
            console.log('Skipped existing version:', nextTask);
            renderConversionQueue();
            updateStats();

            // Continue to next task
            setTimeout(() => processNextTask(), 500);
            return;
          }

          if (hasExistingVersion && overwriteMode === 'ask') {
            const confirmed = confirm(`Chapter "${nextTask.chapterTitle}" already has a ${nextTask.targetLanguageName} version. Overwrite?`);
            if (!confirmed) {
              nextTask.status = 'completed';
              nextTask.progress = 100;
              nextTask.endTime = new Date();
              console.log('User chose not to overwrite:', nextTask);
              renderConversionQueue();
              updateStats();

              // Continue to next task
              setTimeout(() => processNextTask(), 500);
              return;
            }
          }
        }

        // Start translation task
        const url = `/api/novels/${nextTask.novelName}/chapters/${nextTask.chapterId}/translate/${nextTask.targetLanguage}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            overwrite: overwriteMode === 'overwrite' || overwriteMode === 'ask'
          })
        });

        if (response.ok) {
          const result = await response.json();
          if (result.success && result.task_id) {
            // Poll task status, then process next when done
            nextTask.serverTaskId = result.task_id;
            await pollTaskProgressWithCallback(nextTask, () => {
              // After current task, process next
              setTimeout(() => processNextTask(), 1000);
            });
          } else {
            throw new Error(result.error || 'Failed to start translation task');
          }
        } else {
          const errorResult = await response.json();
          throw new Error(errorResult.error || `Translation failed: ${response.statusText}`);
        }

      } catch (error) {
        console.error('Task processing failed:', nextTask, error);
        nextTask.status = 'failed';
        nextTask.progress = 0;
        nextTask.error = error.message;
        nextTask.endTime = new Date();
        renderConversionQueue();
        updateStats();

        // Continue to next task even if failed
        setTimeout(() => processNextTask(), 1000);
      }
    }


    // Poll task progress (with completion callback)
    async function pollTaskProgressWithCallback(task, onComplete) {
      const maxAttempts = 300; // Maximum polling attempts (seconds)
      let attempts = 0;

      const poll = async () => {
        try {
          const response = await fetch(`/api/translation/status/${task.serverTaskId}`);
          if (response.ok) {
            const status = await response.json();

            // Update task progress
            task.progress = status.progress || 0;
            task.estimatedTime = status.estimated_time;

            if (status.status === 'completed') {
              task.status = 'completed';
              task.progress = 100;
              task.endTime = new Date();
              console.log('Task completed:', task);
              renderConversionQueue();
              updateStats();

              // Call completion callback
              if (onComplete) {
                onComplete();
              }
              return;
            } else if (status.status === 'failed') {
              task.status = 'failed';
              task.error = status.error || 'Translation failed';
              task.endTime = new Date();
              console.log('Task failed:', task);
              renderConversionQueue();
              updateStats();

              // Call callback to continue to next even if failed
              if (onComplete) {
                onComplete();
              }
              return;
            } else if (status.status === 'stopped') {
              task.status = 'failed';
              task.error = 'Task stopped';
              task.endTime = new Date();
              console.log('Task stopped:', task);
              renderConversionQueue();
              updateStats();

              // Call callback to continue to next even if stopped
              if (onComplete) {
                onComplete();
              }
              return;
            } else if (status.status === 'processing' || status.status === 'queued') {
              // Continue polling
              renderConversionQueue();
              updateStats();

              attempts++;
              if (attempts < maxAttempts) {
                setTimeout(poll, 1000); // Poll every second
              } else {
                // Timeout, mark as failed
                task.status = 'failed';
                task.error = 'Task timeout';
                task.endTime = new Date();
                renderConversionQueue();
                updateStats();
                console.log('Task timeout:', task);

                // Call callback to continue to next even if timeout
                if (onComplete) {
                  onComplete();
                }
              }
            }
          } else {
            throw new Error('Failed to get task status');
          }
        } catch (error) {
          console.error('Failed to poll task status:', error);
          attempts++;
          if (attempts >= 3) {
            // After 3 consecutive failures, mark as failed
            task.status = 'failed';
            task.error = 'Unable to get task status';
            task.endTime = new Date();
            renderConversionQueue();
            updateStats();
            console.log('Task status query failed:', task);

            // Call callback to continue to next even if failed
            if (onComplete) {
              onComplete();
            }
          } else {
            // Retry, increase polling interval
            setTimeout(poll, 2000);
          }
        }
      };

      // Start polling
      poll();
    }

    // Clear queue
    function clearQueue() {
      if (isProcessing) {
        alert('Conversion is in progress, cannot clear the queue');
        return;
      }

      if (conversionQueue.length === 0) {
        alert('The queue is already empty');
        return;
      }

      // Only clear tasks with status waiting, failed, or completed
      const removableTasks = conversionQueue.filter(t => t.status === 'waiting' || t.status === 'failed' || t.status === 'completed');
      if (removableTasks.length === 0) {
        alert('No tasks to clear');
        return;
      }

      const confirmed = confirm(`Are you sure you want to clear ${removableTasks.length} tasks?`);
      if (confirmed) {
        // Keep processing/queued tasks
        conversionQueue = conversionQueue.filter(t => t.status === 'processing' || t.status === 'queued');
        selectedChapters.clear();

        renderConversionQueue();
        updateStats();
        updateChapterSelection();
        updateSelectAllCheckbox();
        console.log('Queue cleared');
      }
    }

    // Stop a single task
    async function stopTask(taskId) {
      try {
        const response = await fetch(`/api/translation/stop/${taskId}`, {
          method: 'POST'
        });

        if (response.ok) {
          const result = await response.json();
          if (result.success) {
            console.log('Task stopped:', taskId);
            // Update local task status
            const task = conversionQueue.find(t => t.serverTaskId === taskId || t.id === taskId);
            if (task) {
              task.status = 'stopped';
              task.error = 'Task has been stopped';
              task.endTime = new Date();
            }
            renderConversionQueue();
            updateStats();
          } else {
            alert(`Failed to stop task: ${result.error}`);
          }
        } else {
          const errorResult = await response.json();
          alert(`Failed to stop task: ${errorResult.error}`);
        }
      } catch (error) {
        console.error('Failed to stop task:', error);
        alert('Failed to stop task, please try again');
      }
    }

    // Stop all tasks
    async function stopAllTasks() {
      const processingTasks = conversionQueue.filter(t => t.status === 'queued' || t.status === 'processing');

      if (processingTasks.length === 0) {
        alert('No running tasks');
        return;
      }

      const confirmed = confirm(`Are you sure you want to stop all running tasks? Total: ${processingTasks.length} tasks.`);
      if (!confirmed) return;

      try {
        const response = await fetch('/api/translation/stop-all', {
          method: 'POST'
        });

        if (response.ok) {
          const result = await response.json();
          if (result.success) {
            console.log('All tasks stopped');

            // Update local task status
            conversionQueue.forEach(task => {
              if (task.status === 'queued' || task.status === 'processing') {
                task.status = 'stopped';
                task.error = 'Batch stop operation';
                task.endTime = new Date();
              }
            });

            renderConversionQueue();
            updateStats();
            alert(`Stopped ${result.stopped_count} tasks`);
          } else {
            alert(`Failed to stop tasks: ${result.error}`);
          }
        } else {
          const errorResult = await response.json();
          alert(`Failed to stop tasks: ${errorResult.error}`);
        }
      } catch (error) {
        console.error('Failed to stop all tasks:', error);
        alert('Failed to stop tasks, please try again');
      }
    }

    // Remove task
    function removeTask(taskId) {
      const taskIndex = conversionQueue.findIndex(t => t.id === taskId);
      if (taskIndex !== -1) {
        const task = conversionQueue[taskIndex];

        // Only allow removing tasks with status 'waiting' or 'failed'
        if (task.status === 'processing' || task.status === 'queued') {
          alert('Cannot remove a task that is currently processing');
          return;
        }

        conversionQueue.splice(taskIndex, 1);
        // Also remove from selected chapters
        selectedChapters.delete(task.chapterId);

        renderConversionQueue();
        updateStats();
        updateChapterSelection();
        updateSelectAllCheckbox();
        console.log('Task removed:', taskId);
      }
    }

    // Clear stopped and failed tasks
    async function clearStoppedTasks() {
      const stoppedTasks = conversionQueue.filter(t =>
        t.status === 'stopped' || t.status === 'failed'
      );

      if (stoppedTasks.length === 0) {
        alert('No stopped or failed tasks to clear');
        return;
      }

      if (!confirm(`Are you sure you want to clear ${stoppedTasks.length} stopped/failed tasks?`)) {
        return;
      }

      try {
        const response = await fetch('/api/translation/clear-stopped', {
          method: 'POST'
        });

        if (response.ok) {
          const result = await response.json();
          console.log('Clear stopped tasks result:', result);

          // Remove stopped and failed tasks from local queue
          const initialCount = conversionQueue.length;
          conversionQueue = conversionQueue.filter(task =>
            task.status !== 'stopped' && task.status !== 'failed'
          );
          const removedCount = initialCount - conversionQueue.length;

          renderConversionQueue();
          updateStats();

          alert(`Cleared ${removedCount} stopped/failed tasks`);
        } else {
          throw new Error('Failed to request clearing stopped tasks');
        }
      } catch (error) {
        console.error('Failed to clear stopped tasks:', error);
        alert(`Clear failed: ${error.message}`);
      }
    }
  </script>
