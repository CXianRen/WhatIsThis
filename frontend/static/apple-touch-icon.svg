<!-- Apple Touch Icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fa"/>
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#bookGradient)"/>
  
  <!-- 书本 -->
  <rect x="30" y="45" width="120" height="90" rx="8" ry="8" fill="url(#pageGradient)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- 文本行 -->
  <line x1="45" y1="65" x2="135" y2="65" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="75" x2="125" y2="75" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="85" x2="130" y2="85" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="95" x2="120" y2="95" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="105" x2="135" y2="105" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="115" x2="115" y2="115" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 问号图标 -->
  <circle cx="135" cy="60" r="20" fill="#ff6b6b" stroke="#ffffff" stroke-width="4"/>
  <text x="135" y="72" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">?</text>
</svg>
