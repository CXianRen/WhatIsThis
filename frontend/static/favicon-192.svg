<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fa"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="192" height="192" rx="32" ry="32" fill="url(#bookGradient)"/>
  
  <!-- 书本 -->
  <rect x="32" y="48" width="128" height="96" rx="8" ry="8" fill="url(#pageGradient)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- 文本行 -->
  <line x1="48" y1="72" x2="144" y2="72" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="84" x2="132" y2="84" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="96" x2="140" y2="96" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="108" x2="128" y2="108" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="120" x2="144" y2="120" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 问号图标 -->
  <circle cx="144" cy="72" r="16" fill="#ff6b6b" stroke="#ffffff" stroke-width="3"/>
  <text x="144" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">?</text>
</svg>
